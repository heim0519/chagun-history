ypeable":true,"explain":"호족의 경제력·군사력 약화 + 양인 증가(국가 재정 기반 확대).","src":"01 > 광종"},{"id":"t02-02","kind":"blank","prompt":"광종은 ___의 건의로 과거제를 실시하였다.","choices":["쌍기","최승로","서희","왕식렴"],"answer":"쌍기","typeable":true,"explain":"과거제로 유교적 지식과 능력을 지닌 인재를 뽑았다.","src":"01 > 광종"},{"id":"t02-03","kind":"choice","prompt":"노비안검법의 결과로 옳은 것은?","choices":["호족의 경제력과 군사력이 약해졌다","호족의 세력이 더 강해졌다","불교 행사가 줄어들었다","지방에 관리가 파견되었다"],"answer":"호족의 경제력과 군사력이 약해졌다","explain":"호족이 거느리던 노비가 양인이 되면서 호족은 약해지고 국가는 세금 낼 양인이 늘었다.","src":"01 > 광종"},{"id":"t02-04","kind":"ox","prompt":"광종은 스스로 황제라 칭하고 광덕, 준풍 등의 연호를 사용했다.","answer":true,"explain":"칭제건원(稱帝建元).","src":"01 > 광종"},{"id":"t02-05","kind":"choice","prompt":"다음 중 광종의 업적이 아닌 것은?","choices":["노비안검법 실시","과거제 실시","관리의 공복 제정","12목에 지방관 파견"],"answer":"12목에 지방관 파견","explain":"12목 지방관 파견은 성종(최승로의 시무 28조).","src":"01 > 광종 / 성종"},{"id":"t02-06","kind":"ox","prompt":"광종은 공복의 색깔을 정하여 관리의 위계질서를 세웠다.","answer":true,"explain":"공복 제정 = 관리 서열 정리.","src":"01 > 광종"},{"id":"t02-07","kind":"choice","prompt":"광종이 여러 개혁을 실시한 가장 큰 목적은?","choices":["호족을 누르고 왕권을 강화하려고","불교를 널리 퍼뜨리려고","거란과 교류하려고","서경으로 천도하려고"],"answer":"호족을 누르고 왕권을 강화하려고","explain":"노비안검법·과거제·공신과 호족 숙청 모두 왕권 강화가 목적.","src":"01 > 광종"},{"id":"t02-08","kind":"blank","prompt":"과거제는 신진 인사를 등용하여 신구 세력을 교체하고, 호족을 ___화하는 효과가 있었다.","choices":["관료","귀족","향리","무신"],"answer":"관료","typeable":false,"explain":"호족의 관료화 = 호족을 국가 관리 체계 안으로 편입.","src":"01 > 광종"}]},{"id":"t03","no":3,"title":"고려 성종의 업적","sources":["01","02"],"questions":[{"id":"t03-01","kind":"blank","prompt":"성종은 최승로의 ___를 받아들여 유교 정치 이념을 확립했다.","choices":["시무 28조","훈요 10조","정계","경국대전"],"answer":"시무 28조","accept":["시무28조","시무 이십팔조"],"typeable":true,"explain":"시무 28조: 지방관 파견(7조), 불교 행사 억제(13조), 유교를 통치 이념으로(20조).","src":"01 > 성종"},{"id":"t03-02","kind":"blank","prompt":"성종은 전국의 주요 지역인 ___목에 지방관을 파견했다.","choices":["12","8","5","9"],"answer":"12","accept":["12목","십이"],"typeable":true,"explain":"12목 파견 → 중앙 집권 체제 강화.","src":"01 > 성종"},{"id":"t03-03","kind":"choice" ":"match","prompt":"고려와 조선의 비슷한 기구를 연결하세요.","pairs":[["중서문하성","의정부"],["중추원(왕명 출납)","승정원"],["어사대","사헌부"],["국자감","성균관"]],"explain":"최고 기구 / 비서 기관 / 감찰 기구 / 최고 교육 기관.","src":"02 / 06"},{"id":"t12-08","kind":"blank","prompt":"조선에서 관리의 잘못을 감찰한 기구는 ___이다.","choices":["사헌부","사간원","홍문관","의금부"],"answer":"사헌부","typeable":true,"explain":"고려의 어사대와 같은 역할.","src":"06 > 3사"}]},{"id":"t13","no":13,"title":"조선시대 지방 행정 제도","sources":["06","02"],"questions":[{"id":"t13-01","kind":"blank","prompt":"조선은 전국을 8도로 나누고 ___을/를 파견하여 수령을 지휘·감독하게 했다.","choices":["관찰사","안찰사","병마사","사심관"],"answer":"관찰사","typeable":true,"explain":"조선 8도 = 관찰사 / 고려 5도 = 안찰사, 양계 = 병마사.","src":"06 > 지방행정제도"},{"id":"t13-02","kind":"match","prompt":"조선 지방 행정의 구성원과 역할을 연결하세요.","pairs":[["관찰사","8도에 파견, 수령 지휘·감독"],["수령","군현에 파견, 군현 관리"],["향리","수령의 실무 보좌"],["유향소","지역 양반, 수령 보좌·향리 감시"]],"explain":"유향소 = 지역 양반들의 자치 기구.","src":"06 > 지방행정제도"},{"id":"t13-03","kind":"ox","prompt":"조선 시대 향리는 고려 시대보다 지위가 높아졌다.","answer":false,"explain":"고려까지 향리는 지방 세력가 → 조선부터 하급 관리로 지위 낮아짐.","src":"06 > MEMO 향리의 권력 변화"},{"id":"t13-04","kind":"choice","prompt":"유향소에 대한 설명으로 옳은 것은?","choices":["지역 양반들이 수령을 보좌하고 향리를 감시했다","중앙에서 파견된 관리가 일했다","군사 행정 구역이었다","역사서를 편찬했다"],"answer":"지역 양반들이 수령을 보좌하고 향리를 감시했다","explain":"유향소 = 지역 양반.","src":"06 > 지방행정제도"},{"id":"t13-05","kind":"blank","prompt":"밤에는 횃불, 낮에는 연기로 변방의 위기를 중앙에 알린 통신 제도는 ___이다.","choices":["봉수제","역참제","호패법","오가작통법"],"answer":"봉수제","typeable":true,"explain":"군사 제도와 함께 정비.","src":"06 > 군역제도"},{"id":"t13-06","kind":"ox","prompt":"조선에서는 16~60세의 양인 남자가 직접 군인으로 복무했다.","answer":true,"explain":"군인 비용도 스스로 부담. 중앙에는 5위를 두어 한양과 궁궐 수비.","src":"06 > 군역제도"},{"id":"t13-07","kind":"choice","prompt":"고려와 조선의 지방 행정을 비교한 것으로 옳은 것은?","choices":["고려는 속현이 많았고, 조선은 지방관 파견이 확대되었다","고려는 8도, 조선은 5도·양계였다","고려의 향리는 하급 관리, 조선의 향리는 지방 세력가였다","고려와 조선 모두 관찰사를 파견했다"],"answer":"고려는 속현이 많았고, 조선은 지방관 파견이 확대되었다","explain":"고려: 5도(안찰사)·양계(병마사), 주현보다 속현이 많음 / 조선: 8도(관찰사)·군현(수령).","src":"02 / 06"},{"id":"t13-08","kind":"match","prompt":"고려 지방 행정 구역과 파견 관리를 연결하세요.","pairs":[["5도","안찰사(일반 행정 구역)"],["양계","병마사(군사 행정 구역)"],["조선 8도","관찰사"]],"explain":"고려는 이원적 구조(5도·양계).","src":"02 > 지방 행정 제도"}]},{"id":"t14","no":14,"title":"세종대왕의 업적","sources":["06","07"],"questions":[{"id":"t14-01","kind":"blank","prompt":"세종은 ___을/를 설치하여 학문 연구, 정치 자문, 훈민정음 창제를 지원하게 했다.","choices":["집현전","홍문관","규장각","성균관"],"answer":"집현전","typeable":true,"explain":"세조가 폐지 → 성종이 홍문관으로 계승.","src":"06 > 세종"},{"id":"t14-02","kind":"choice","prompt":"다음 중 세종의 업적이 아닌 것은?","choices":["경국대전 완성","집현전 설치","4군 6진 개척","대마도 정벌"],"answer":"경국대전 완성","explain":"경국대전 완성은 성종.","src":"06 / 07"},{"id":"t14-03","kind":"match","prompt":"세종 때의 인물과 업적을 연결하세요.","pairs":[["최윤덕","4군 개척"],["김종서","6진 개척"],["이종무","대마도 정벌"]],"explain":"4군 6진 → 오늘날과 같은 국경선 형성.","src":"07 > 여진 / 일본"},{"id":"t14-04","kind":"ox","prompt":"세종은 의정부의 권한을 강화하여 신하들의 권력과 왕권의 조화를 추구했다.","answer":true,"explain":"세조는 반대로 의정부 권한 약화.","src":"06 > 세종"},{"id":"t14-05","kind":"blank","prompt":"왕과 신하들이 함께 공부하며 학문과 정치를 논의한 제도는 ___이다.","choices":["경연","서경","음서","천거"],"answer":"경연","typeable":true,"explain":"세종 경연 실시 → 세조 중지 → 성종 재개.","src":"06 > 세종"},{"id":"t14-06","kind":"match","prompt":"조선 초기 왕과 업적을 연결하세요.","pairs":[["태종","호패법, 사병 혁파"],["세종","집현전, 4군 6진"],["세조","직전법, 집현전 폐지"],["성종","경국대전 완성, 홍문관"]],"explain":"시험 단골: 조선 초 왕 ↔ 업적.","src":"06 > 국가 기틀의 마련"},{"id":"t14-07","kind":"choice","prompt":"'사가독서제'에 대한 설명으로 옳은 것은?","choices":["집현전 학자에게 집에서 책만 읽도록 준 유급 휴가","과거에 붙은 사람에게 준 토지","향촌의 자치 규약","왕이 서원에 현판을 내려준 것"],"answer":"집현전 학자에게 집에서 책만 읽도록 준 유급 휴가","explain":"'공부에만 집중해!'","src":"06 > MEMO 집현전과 사가독서제"},{"id":"t14-08","kind":"ox","prompt":"세종 때 여진족을 몰아내고 압록강과 두만강 유역에 4군 6진을 설치했다.","answer":true,"explain":"여진에 대한 강경책. 귀화한 여진족에게 토지·관직을 주는 회유책도 함께 썼다.","src":"07 > 여진"},{"id":"t14-09","kind":"ox","prompt":"세종은 훈민정음을 창제했고, 집현전이 이를 지원했다.","answer":true,"explain":"집현전의 역할 중 하나.","src":"06 > 세종"}]},{"id":"t15","no":15,"title":"조선시대 과거시험","sources":["07","02"],"questions":[{"id":"t15-01","kind":"match","prompt":"과거 시험의 종류와 뽑는 사람을 연결하세요.","pairs":[["문과","문관"],["무과","무관(병서와 무예 평가)"],["잡과","기술관"]],"explain":"문과는 주로 양반, 잡과는 중인 층이 많이 응시.","src":"07 > 관리 등용 제도"},{"id":"t15-02","kind":"blank","prompt":"문과의 소과에는 유교 경전을 시험하는 생원과와, 글 작문 실력을 평가하는 ___이/가 있었다.","choices":["진사과","명경과","제술과","승과"],"answer":"진사과","typeable":true,"explain":"소과 = 생원과 + 진사과.","src":"07 > 과거"},{"id":"t15-03","kind":"choice","prompt":"소과에 합격하면 할 수 있었던 것은?","choices":["성균관 입학과 대과 응시","바로 3정승이 됨","음서로 관직을 받음","무과에 자동 합격"],"answer":"성균관 입학과 대과 응시","explain":"성균관에서 300일 이상 출석해야 대과 응시 자격.","src":"07 > 과거 / MEMO"},{"id":"t15-04","kind":"ox","prompt":"조선에서는 천민이 아니면 법적으로 과거 시험에 응시할 수 있었다.","answer":true,"explain":"고려도 법적으로 양인 이상 응시 가능.","src":"07 > 과거"},{"id":"t15-05","kind":"ox","prompt":"조선의 음서는 고려보다 범위가 넓어졌다.","answer":false,"explain":"조선 음서는 범위가 줄었고, 과거에 붙지 않으면 낮은 관직에 머물렀다 → 과거가 더 중요.","src":"07 > 음서"},{"id":"t15-06","kind":"blank","prompt":"관리들의 추천을 받아 개인의 능력을 기준으로 관리를 뽑는 제도는 ___이다.","choices":["천거","음서","경연","서경"],"answer":"천거","typeable":true,"explain":"조선 관리 등용: 과거, 음서, 천거.","src":"07 > 천거"},{"id":"t15-07","kind":"ox","prompt":"고려와 조선 모두 무과를 활발하게 시행했다.","answer":false,"explain":"고려는 무과를 거의 시행하지 않음 / 조선은 무과 시행.","src":"02 / 07"},{"id":"t15-08","kind":"choice","prompt":"조선 과거 시험에 대한 설명으로 옳지 않은 것은?","choices":["승려에게 승계를 주는 승과가 중심이었다","3년에 한 번 치러졌다","대과에서 최종 33명을 뽑았다","잡과로 기술관을 선발했다"],"answer":"승려에게 승계를 주는 승과가 중심이었다","explain":"승과는 고려의 과거 종류 (고려: 제술과·명경과·잡과·승과).","src":"02 / 07"},{"id":"t15-09","kind":"match","prompt":"고려와 조선의 관리 등용 제도를 비교해 연결하세요.","pairs":[["고려 음서","5품 이상 자손, 귀족 사회 유지 수단"],["조선 음서","범위 축소, 승진에 한계"],["고려 과거","무과 거의 없음, 승과 있음"],["조선 과거","문과·무과·잡과"]],"explain":"비교 문제 대비.","src":"02 / 07"}]}]`),ch=JSON.parse(`[{"id":"t16","no":16,"title":"사림의 형성","sources":["08","09"],"questions":[{"id":"t16-01","kind":"blank","prompt":"성종 때 훈구를 견제하기 위해 등용된 영남 출신 사림의 대표 인물은 ___이다.","choices":["김종직","한명회","조광조","이황"],"answer":"김종직","typeable":true,"explain":"김종직 제자들이 3사에 등용 → 훈구 비판.","src":"08 > 사림의 정계 진출"},{"id":"t16-02","kind":"blank","prompt":"세조의 즉위(계유정난)에 공을 세운 대표적인 훈구 공신은 ___이다.","choices":["한명회","김종직","정도전","정몽주"],"answer":"한명회","typeable":true,"explain":"압구정동 이름의 유래.","src":"08 > 훈구의 권력 독점"},{"id":"t16-03","kind":"match","prompt":"훈구와 사림을 비교하여 연결하세요.","pairs":[["훈구","조선 건국·국왕 즉위에 공을 세운 공신, 많은 토지와 노비"],["사림","지방에서 학문·교육에 힘씀, 온건파 학풍 계승"]],"explain":"사림 = 왕도 정치와 향촌 자치 주장.","src":"08"},{"id":"t16-04","kind":"order","prompt":"4대 사화를 일어난 순서대로 놓으세요.","answer":["무오사화","갑자사화","기묘사화","을사사화"],"explain":"1498 → 1504 → 1519 → 1545.암기법: (무) 갑자기 기묘한 을사사화가 일어났다.","src":"08 > 훈구와 사림의 갈등"},{"id":"t16-05","kind":"match","prompt":"사화와 원인을 연결하세요.","pairs":[["무오사화","김종직의 조의제문"],["갑자사화","연산군의 어머니 폐비 윤씨 사건"],["기묘사화","조광조의 급진적 개혁"],["을사사화","외척 대윤과 소윤의 다툼"]],"explain":"사화 = 사림이 큰 피해를 입은 사건.","src":"08 > 훈구와 사림의 갈등"},{"id":"t16-06","kind":"blank","prompt":"조광조는 학문이 뛰어난 인재를 추천으로 뽑는 ___을/를 실시했다.","choices":["현량과","천거","음서","잡과"],"answer":"현량과","typeable":true,"explain":"과거 없이 사림이 정계에 대거 진출.","src":"08 > 기묘사화"},{"id":"t16-07","kind":"choice","prompt":"조광조의 개혁 내용이 아닌 것은?","choices":["집현전 설치","소격서 폐지","현량과 실시","공신의 위훈 삭제 주장"],"answer":"집현전 설치","explain":"집현전은 세종. 소격서 = 왕실 도교 행사 관청.","src":"08 > 기묘사화"},{"id":"t16-08","kind":"choice","prompt":"나뭇잎에 '주초위왕(走肖爲王)'을 쓴 사건과 관련된 사화는?","choices":["기묘사화","무오사화","갑자사화","을사사화"],"answer":"기묘사화","explain":"주(走)+초(肖) = 조(趙) → 조씨가 왕이 된다 → 조광조 제거.","src":"08 > MEMO 기묘사화"},{"id":"t16-09","kind":"ox","prompt":"사림은 세조의 왕위 계승에 공을 세워 권력을 잡았다.","answer":false,"explain":"그건 훈구(한명회 등). 사림은 조선 건국에 참여하지 않고 지방에서 학문에 힘썼다.","src":"08"},{"id":"t16-10","kind":"choice","prompt":"사화로 피해를 입은 사림이 지방에서 세력을 키운 기반은?","choices":["서원과 향약","교정도감과 도방","의정부와 6조","유향소와 경재소"],"answer":"서원과 향약","explain":"서원: 학문·제사·교육 / 향약: 향촌 자치 규약.","src":"09 > 서원·향약"},{"id":"t16-11","kind":"blank","prompt":"최초의 사액 서원은 백운동 서원으로, 명종에게 ___ 서원이라는 현판을 받았다.","choices":["소수","병산","도산","성균"],"answer":"소수","accept":["소수 서원","소수서원"],"typeable":true,"explain":"사액 = 왕이 서원 이름 현판을 내려줌.","src":"09 > MEMO 사액서원"},{"id":"t16-12","kind":"ox","prompt":"중종 때 사림은 중국의 『여씨향약』을 번역하여 보급했다.","answer":true,"explain":"이후 이황·이이가 우리 실정에 맞는 향약을 만듦.","src":"09 > 향약"}]},{"id":"t17","no":17,"title":"붕당의 형성","sources":["09"],"questions":[{"id":"t17-01","kind":"blank","prompt":"동인과 서인이 나뉜 계기는 ___의 임명 문제였다.","choices":["이조 전랑","영의정","관찰사","대사헌"],"answer":"이조 전랑","accept":["이조전랑"],"typeable":true,"explain":"이조 전랑 = 인사권 + 후임자 추천권 → 막강한 자리.","src":"09 > 붕당의 형성"},{"id":"t17-02","kind":"match","prompt":"붕당과 특징을 연결하세요.","pairs":[["동인","영남 지역, 이황·조식"],["서인","경기·충청 지역, 이이·성혼"]],"explain":"김효원(한양 동쪽) = 동인 / 심의겸(한양 서쪽) = 서인.","src":"09 > 동인 vs 서인"},{"id":"t17-03","kind":"ox","prompt":"동인은 이후 노론과 소론으로 나뉘었다.","answer":false,"explain":"동인 → 남인·북인 / 서인 → 노론·소론.","src":"09 > 붕당의 계보도"},{"id":"t17-04","kind":"match","prompt":"붕당이 나뉜 결과를 연결하세요.","pairs":[["동인","남인과 북인"],["서인","노론과 소론"]],"explain":"동인은 선조 말(1591), 서인은 숙종 초에 분당.","src":"09 > 붕당의 계보도"},{"id":"t17-05","kind":"choice","prompt":"사림이 정치의 주도권을 잡고 붕당이 형성된 왕은?","choices":["선조","성종","중종","세조"],"answer":"선조","explain":"선조 때 사림 집권 → 동인·서인 분당.","src":"09 > 사림의 집권"},{"id":"t17-06","kind":"match","prompt":"이조 전랑 자리를 두고 다툰 인물과 붕당을 연결하세요.","pairs":[["김효원","동인 (한양 동쪽에 살아서)"],["심의겸","서인 (한양 서쪽에 살아서)"]],"explain":"사는 곳에서 이름이 나옴.","src":"09 > MEMO 동인과 서인"},{"id":"t17-07","kind":"ox","prompt":"붕당 정치 초기에는 상대 붕당의 입장을 존중하면서 비판하고 견제했다.","answer":true,"explain":"공론 = 붕당 안에서 토론해 합의한 의견.","src":"09 > 붕당의 형성"},{"id":"t17-08","kind":"match","prompt":"학자와 책·주장을 연결하세요.","pairs":[["이황","성학십도, 도덕적 원리(理) 강조"],["이이","성학집요, 10만 양병설"]],"explain":"이황 → 동인(남인)·영남학파 / 이이 → 서인·기호학파. 1,000원권·5,000원권.","src":"09 > MEMO 이황과 이이"},{"id":"t17-09","kind":"choice","prompt":"붕당이 생긴 직접적 배경이 아닌 것은?","choices":["몽골의 침입","훈구 세력 처리 문제로 인한 사림 내부 갈등","이조 전랑 임명 문제","사림의 정치 주도권 장악"],"answer":"몽골의 침입","explain":"몽골 침입은 고려 시대.","src":"09"}]},{"id":"t18","no":18,"title":"임진왜란의 영향","sources":["10"],"questions":[{"id":"t18-01","kind":"blank","prompt":"일본은 '명을 정벌하러 가니 길을 빌려 달라'는 ___을/를 구실로 조선을 침략했다.","choices":["정명가도","칭제건원","사대교린","친명배금"],"answer":"정명가도","typeable":true,"explain":"1592년 4월 임진왜란.","src":"10 > 왜란의 발발"},{"id":"t18-02","kind":"order","prompt":"임진왜란 전개 과정을 순서대로 놓으세요.","answer":["부산진·동래성 함락","선조의 의주 피란, 일본군 한성 점령","한산도 대첩","조·명 연합군의 평양성 승리","휴전 협상 결렬, 정유재란 발발","노량 해전"],"explain":"1592 임진왜란 → 1597 정유재란 → 1598 노량 해전으로 종료.정유재란 중 명량 해전 승리 → 도요토미 사망 → 노량 해전.","src":"10"},{"id":"t18-03","kind":"match","prompt":"인물과 활약을 연결하세요.","pairs":[["곽재우","의병장, 일본군 보급로 차단"],["이순신","한산도 대첩, 명량·노량 해전"],["김시민","진주성 승리"],["권율","행주산성 승리"]],"explain":"유정·휴정 등 승려들도 승군 조직.","src":"10 > 의병과 수군의 활약"},{"id":"t18-04","kind":"choice","prompt":"임진왜란이 조선에 끼친 영향이 아닌 것은?","choices":["국가 재정이 넉넉해졌다","토지가 황폐해졌다","궁궐과 사고가 불탔다","문화재를 약탈당했다"],"answer":"국가 재정이 넉넉해졌다","explain":"백성의 생활과 국가 재정이 어려워졌다. 귀무덤·코무덤.","src":"10 > 왜란의 영향"},{"id":"t18-05","kind":"blank","prompt":"전쟁 후 일본과의 국교 회복을 위해 조선이 파견한 사절단은 ___이다.","choices":["조선 통신사","연행사","별무반","삼별초"],"answer":"조선 통신사","accept":["통신사","조선통신사"],"typeable":true,"explain":"도쿠가와 이에야스(에도 막부)의 국교 정상화 요청. 선진 문물 전파 + 일본 정세 보고. 청에 보낸 사절은 연행사.","src":"10 > 왜란의 영향 / MEMO"},{"id":"t18-06","kind":"blank","prompt":"포로로 끌려간 도공 ___은/는 일본 아리타 도자기 형성에 크게 기여했다.","choices":["이삼평","이순신","이종무","이황"],"answer":"이삼평","typeable":true,"explain":"일본은 성리학자·활자 인쇄공·도자기 기술자를 통해 문화 발전.","src":"10 > 왜란의 영향 > 일본"},{"id":"t18-07","kind":"match","prompt":"나라별 임진왜란의 영향을 연결하세요.","pairs":[["조선","국토 황폐화, 문화재 약탈"],["일본","성리학·도자기 등 문화 발전, 에도 막부 성립"],["명","국력 약화, 만주에서 여진족 성장"]],"explain":"명 약화 → 여진(후금) 성장 → 호란으로 이어짐!","src":"10 > 왜란의 영향"},{"id":"t18-08","kind":"ox","prompt":"휴전 기간 동안 조선은 훈련도감을 설치하고 화포를 개량했다.","answer":true,"explain":"조총도 제작 → 정유재란 때 효과적으로 방어.","src":"10 > 정유재란"},{"id":"t18-09","kind":"blank","prompt":"이순신의 ___ 승리로 조선은 서남해의 제해권을 장악했다.","choices":["한산도 대첩","귀주 대첩","행주 대첩","명량 해전"],"answer":"한산도 대첩","accept":["한산도대첩","한산도"],"typeable":true,"explain":"곡창 지대(충청·전라) 보호 + 일본군 해상 보급로 차단.","src":"10 > 수군의 활약"},{"id":"t18-10","kind":"ox","prompt":"이순신의 『난중일기』는 2013년 유네스코 세계 기록 유산으로 등재되었다.","answer":true,"explain":"전쟁 상황이 상세히 기록됨.","src":"10 > MEMO 난중일기"},{"id":"t18-11","kind":"blank","prompt":"이순신이 퇴각하는 일본군을 무찌르며 전쟁이 끝난 해전은 ___이다.","choices":["노량 해전","명량 해전","한산도 대첩","옥포 해전"],"answer":"노량 해전","accept":["노량해전","노량"],"typeable":true,"explain":"명량 해전은 정유재란 중 승리, 노량 해전이 마지막.","src":"10 > 정유재란 > 결과"}]},{"id":"t19","no":19,"title":"공민왕의 개혁 정책 (논술형)","essay":true,"sources":["05"],"questions":[{"id":"t19-01","kind":"blank","prompt":"공민왕은 신돈을 등용하여 ___을/를 설치하고, 권문세족이 빼앗은 토지와 노비를 원래대로 돌려놓았다.","choices":["전민변정도감","교정도감","식목도감","정동행성"],"answer":"전민변정도감","typeable":true,"explain":"강제로 노비가 된 사람도 해방 → 왕권 강화.","src":"05 > 공민왕의 개혁 정치"},{"id":"t19-02","kind":"blank","prompt":"원나라에 기대어 권력을 누린 원 간섭기의 새로운 지배층은 ___이다.","choices":["권문세족","신진 사대부","문벌 귀족","훈구"],"answer":"권문세족","typeable":true,"explain":"고위 관직 독점, 음서로 세습, 막대한 농장과 노비 → 국가 재정 궁핍.","src":"05 > 권문세족의 성장"},{"id":"t19-03","kind":"choice","prompt":"공민왕의 '반원 자주' 정책이 아닌 것은?","choices":["전민변정도감 설치","기철 등 친원 세력 숙청","정동행성 이문소 폐지","쌍성총관부 공격"],"answer":"전민변정도감 설치","explain":"전민변정도감은 '내정 개혁(왕권 강화)'.","src":"05 > 공민왕의 개혁 정치"},{"id":"t19-04","kind":"match","prompt":"공민왕의 개혁과 내용을 연결하세요.","pairs":[["기철 일파 숙청","친원 세력 제거"],["쌍성총관부 공격","철령 이북 땅 되찾음"],["정동행성 이문소 폐지","원의 내정 간섭 기구 제거"],["전민변정도감 설치","토지·노비 바로잡기(권문세족 약화)"],["성균관 정비","신진 사대부 성장"]],"explain":"자주성 회복(반원) + 내정 개혁(왕권 강화).","src":"05 > 공민왕의 개혁 정치"},{"id":"t19-05","kind":"choice","prompt":"공민왕이 개혁을 추진할 수 있었던 국제 정세는?","choices":["원·명 교체기","거란과 송의 대립","금의 건국","임진왜란"],"answer":"원·명 교체기","explain":"원이 약해지고 명이 일어나던 시기를 이용.","src":"05 > 공민왕 > 배경"},{"id":"t19-06","kind":"ox","prompt":"공민왕의 개혁은 권문세족의 반발과 홍건적·왜구의 침입으로 실패했다.","answer":true,"explain":"신돈 제거, 공민왕 시해로 실패.","src":"05 > 공민왕 > 결과"},{"id":"t19-07","kind":"blank","prompt":"원은 화주에 ___을/를 설치하여 철령 이북 땅을 직접 지배했다.","choices":["쌍성총관부","동녕부","탐라총관부","정동행성"],"answer":"쌍성총관부","typeable":true,"explain":"동녕부(서경), 탐라총관부(제주). 공민왕이 쌍성총관부를 공격해 되찾음.","src":"05 > 원의 내정 간섭"},{"id":"t19-08","kind":"choice","prompt":"원 간섭기 고려의 모습으로 옳지 않은 것은?","choices":["고려 왕실 호칭이 황제로 높아졌다","공녀와 환관을 원에 보냈다","몽골풍이 유행했다","정동행성을 통해 내정 간섭을 받았다"],"answer":"고려 왕실 호칭이 황제로 높아졌다","explain":"반대로 격하: 조·종 → 왕(충○왕), 짐 → 고, 폐하 → 전하, 태자 → 세자.","src":"05 > 원의 내정 간섭 / MEMO"},{"id":"t19-09","kind":"ox","prompt":"공민왕은 몽골풍을 금지하고 왕실 호칭과 제도를 복구했다.","answer":true,"explain":"자주성 회복 정책.","src":"05 > 공민왕 > 자주성 회복"},{"id":"t19-10","kind":"essay","prompt":"[논술형] 공민왕의 개혁 정책을 '배경 - 내용(반원 자주 정책, 왕권 강화 정책) - 결과'로 나누어 서술하시오.","answer":"공민왕은 원·명 교체기를 이용하여 개혁을 추진하였다. 먼저 반원 자주 정책으로 기철 등 친원 세력을 숙청하고, 내정 간섭 기구인 정동행성 이문소를 폐지하였으며, 쌍성총관부를 공격하여 철령 이북의 땅을 되찾았다. 또 몽골풍을 금지하고 왕실 호칭과 관제를 복구하였다. 왕권 강화 정책으로는 신돈을 등용하여 전민변정도감을 설치하고, 권문세족이 빼앗은 토지를 원래 주인에게 돌려주고 억울하게 노비가 된 사람을 해방시켰다. 또 성균관을 정비하여 유학 교육을 강화하고 신진 사대부를 성장시켰다. 그러나 권문세족의 반발과 홍건적·왜구의 침입으로 신돈이 제거되고 공민왕이 시해되면서 개혁은 실패하였다.","points":["배경: 원·명 교체기","반원: 기철(친원 세력) 숙청","반원: 정동행성 이문소 폐지","반원: 쌍성총관부 공격 → 철령 이북 회복","반원: 몽골풍 금지, 관제·호칭 복구","왕권 강화: 신돈 등용, 전민변정도감 설치(토지·노비 바로잡기)","왕권 강화: 성균관 정비 → 신진 사대부 성장","결과: 권문세족 반발 + 홍건적·왜구 침입 → 실패"],"explain":"채점 포인트를 몇 개 넣었는지 스스로 체크하세요. 핵심 단어(전민변정도감, 쌍성총관부, 정동행성, 권문세족)는 꼭!","src":"05 > 공민왕의 개혁 정치"},{"id":"t19-11","kind":"essay","prompt":"[논술형] 공민왕이 전민변정도감을 설치한 목적과 그 효과를 서술하시오.","answer":"권문세족이 불법으로 빼앗은 토지를 원래 주인에게 돌려주고, 억울하게 노비가 된 사람들을 양인으로 해방시키기 위해 설치하였다. 이를 통해 권문세족의 경제적 기반을 약화시키고 국가 재정을 확충하여 왕권을 강화하려 하였다.","points":["권문세족이 빼앗은 토지 반환","억울하게 노비가 된 사람 해방","권문세족 약화","국가 재정 확충·왕권 강화"],"explain":"광종의 노비안검법과 목적이 비슷하다(호족/권문세족 약화).","src":"05 > 공민왕 > 내정 개혁"}]},{"id":"t20","no":20,"title":"조선시대 외교 관계 (논술형)","essay":true,"sources":["07","11"],"questions":[{"id":"t20-01","kind":"blank","prompt":"조선 외교의 기본 방침은 명을 섬기는 사대와 이웃 나라와 가깝게 지내는 ___이다.","choices":["교린","북벌","중립","척화"],"answer":"교린","typeable":true,"explain":"사대(명) + 교린(여진, 일본 등) = 사대교린.","src":"07 > 사대교린"},{"id":"t20-02","kind":"match","prompt":"나라와 조선의 외교를 연결하세요.","pairs":[["명","사대: 조공(말, 인삼) ↔ 답례(약재, 서적)"],["여진","교린: 무역소, 귀화 장려, 4군 6진 개척"],["일본","교린: 대마도 정벌, 3포 개항, 왜관"],["류큐·시암·자와","토산품 ↔ 문방구, 불교·유교 경전"]],"explain":"여진·일본에는 강경책(정벌)과 회유책(무역 허용)을 함께 씀.","src":"07 > 사대교린"},{"id":"t20-03","kind":"choice","prompt":"조선이 일본에 개항한 3포가 아닌 것은?","choices":["벽란도","제포","염포","부산포"],"answer":"벽란도","explain":"3포: 제포(창원 진해), 염포(울산), 부산포. 벽란도는 고려의 무역항.","src":"07 > 일본"},{"id":"t20-04","kind":"ox","prompt":"조선은 명과의 사대 관계를 통해 선진 문물을 받아들이고 국제적 지위를 인정받았다.","answer":true,"explain":"사대 = 외교적 안정과 실리.","src":"07 > 명과의 사대 관계"},{"id":"t20-05","kind":"blank","prompt":"조선이 무역을 통제하자 3포의 일본인들이 일으킨 반란은 ___이다.","choices":["삼포왜란","임진왜란","정유재란","이괄의 난"],"answer":"삼포왜란","typeable":true,"explain":"무역 통제 강화에 반발.","src":"07 > 일본"},{"id":"t20-06","kind":"ox","prompt":"조선 시대의 교린 관계에는 중국(명)도 포함된다.","answer":false,"explain":"교린 = 중국을 '제외한' 주변국과의 교류.","src":"07 > 교린"},{"id":"t20-07","kind":"blank","prompt":"광해군은 명과 후금 사이에서 ___ 외교를 펼쳤다.","choices":["중립","친명배금","사대","북벌"],"answer":"중립","accept":["중립 외교","중립외교"],"typeable":true,"explain":"강홍립을 보내 적절히 대응하도록 지시 → 명이 패하자 후금에 투항.","src":"11 > 중립외교"},{"id":"t20-08","kind":"match","prompt":"호란과 결과를 연결하세요.","pairs":[["정묘호란(1627)","후금과 형제 관계 체결"],["병자호란(1636)","남한산성 항전 후 삼전도에서 항복, 군신 관계"]],"explain":"원인: 인조·서인의 친명배금 정책.","src":"11 > 정묘호란과 병자호란"},{"id":"t20-09","kind":"order","prompt":"광해군부터 효종까지 대외 관계의 변화를 순서대로 놓으세요.","answer":["광해군의 중립 외교","인조반정","친명배금 정책","정묘호란, 형제 관계","병자호란, 삼전도 항복","효종의 북벌 운동"],"explain":"1623 인조반정 → 1627 정묘호란 → 1636 병자호란.호란 후 북벌론 → 이후 북학론(청 문물 수용).","src":"11"},{"id":"t20-10","kind":"match","prompt":"병자호란 때 두 주장을 연결하세요.","pairs":[["주화론","외교로 해결하자 (화친)"],["척화론","끝까지 맞서 싸우자"]],"explain":"손글씨 메모: 주화론=항복, 척화론=버티기.","src":"11 > 병자호란"},{"id":"t20-11","kind":"choice","prompt":"효종이 추진한 정책은?","choices":["북벌 운동","중립 외교","4군 6진 개척","대마도 정벌"],"answer":"북벌 운동","explain":"봉림대군(효종): 청에 끌려갔다 돌아와 왕이 됨 → 성곽·무기 정비, 군대 육성. 효종 사망 후 중단.","src":"11 > 북벌 운동"},{"id":"t20-12","kind":"essay","prompt":"[논술형] 조선 전기의 외교 정책인 '사대교린'을 명, 여진, 일본과의 관계를 예로 들어 서술하시오.","answer":"조선은 큰 나라를 섬기는 사대와 이웃 나라와 가깝게 지내는 교린을 외교의 기본 방침으로 삼았다. 명과는 사대 관계를 맺어 해마다 사신을 보내 조공품(말, 인삼)을 바치고 약재·서적 등의 답례품을 받았으며, 이를 통해 선진 문물을 받아들이고 국제적 지위를 인정받아 외교적 안정과 실리를 얻었다. 여진과 일본에는 교린 정책을 펼쳐 강경책과 회유책을 함께 썼다. 여진에 대해서는 국경 무역소를 열고 귀화한 여진족에게 토지와 관직을 주는 한편, 세종 때 최윤덕과 김종서를 보내 4군 6진을 개척하였다. 일본에 대해서는 세종 때 이종무를 보내 대마도를 정벌하는 한편, 3포(제포·염포·부산포)를 열어 제한된 무역을 허락하였다.","points":["사대 = 큰 나라(명)를 섬김 / 교린 = 이웃 나라와 친하게","명: 조공(말·인삼) ↔ 답례(약재·서적)","사대의 성격: 선진 문물 수용, 국제적 지위 인정(실리·안정)","여진 회유: 무역소, 귀화 장려(토지·관직)","여진 강경: 4군(최윤덕) 6진(김종서) 개척","일본 강경: 대마도 정벌(이종무)","일본 회유: 3포 개항, 제한적 무역(왜관)"],"explain":"'강경책 + 회유책' 이라는 표현을 꼭 쓰면 좋아요.","src":"07 > 사대교린"},{"id":"t20-13","kind":"essay","prompt":"[논술형] 광해군의 중립 외교와 인조의 친명배금 정책을 비교하고, 그 결과를 서술하시오.","answer":"광해군은 명과 후금 사이에서 중립 외교를 펼쳤다. 명이 군사 지원을 요청하자 강홍립을 파견하되 상황에 따라 적절히 대응하도록 하였고, 명이 패하자 강홍립은 후금에 투항하였다. 그러나 의리와 명분을 중시한 서인은 이에 반발하였고, 인조반정(1623)으로 인조가 즉위하였다. 인조와 서인 정권은 명을 가까이하고 후금을 배척하는 친명배금 정책을 펼쳤고, 그 결과 후금이 침략하여 정묘호란(1627)이 일어나 형제 관계를 맺었다. 이후 청으로 이름을 바꾼 후금이 군신 관계를 요구하며 다시 침략하여 병자호란(1636)이 일어났고, 인조는 남한산성에서 버티다 삼전도에서 항복하였다.","points":["광해군: 중립 외교, 강홍립 파견","서인의 반발 → 인조반정(1623)","인조·서인: 친명배금","결과1: 정묘호란(1627) → 형제 관계","결과2: 병자호란(1636) → 남한산성 → 삼전도 굴욕(군신 관계)"],"explain":"호란은 핵심 주제 20번 '조선시대 외교 관계'에 포함될 수 있어 넣었어요.","src":"11"}]}]`),dh=`# 역사 시험범위 전체 정리

# Ⅲ. 고려의 성립과 변천 — 1. 고려의 건국과 정치 변화 (p.76~79)

> 원본: \`KakaoTalk_20261107_114152237.jpg\` (학습지 1쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함. ★ = 학습지에 별표 친 부분

## ① 나라의 기틀을 다지다

### 태조 (① **왕건**) (918~943)

#### 건국 및 후삼국 통일
- **고려 건국(918년)**: 고구려 계승 → 국호 고려 / 연호(천수) 사용
  - → **송악(개경)** 천도(919년)
- **통일 정책**: 호족·선종 승려 포섭 + 신라와 화친 + 후백제와 대립
  - ⇒ 발해 세자 대광현 및 수만 명의 유민들이 고려에 망명(926년?)
  - \\+ 후백제 내부 지배층 분열 → 견훤의 투항(935년)
  - \\+ 신라 경순왕의 통합 요청(935년)
  - ⇒ 후백제 격파 → **후삼국 통일(936년)**
- **의의**: 외세의 도움 없이 **자주적**으로 민족 재통합 이룩
  - → 새로운 민족 문화 발전의 토대 마련
  - \\+ 지방 세력의 정치 참여로 정치 참여 세력 폭 **확대**

#### 정책
| 구분 | 내용 |
|---|---|
| **민생 안정** | 세율을 1/10로 정하여 조세 부담 감소 / 빈민 구제를 위해 흑창 설치 |
| **호족 포섭 및 견제** | 포섭책: **혼인** 정책, **사성(賜姓)** 정책, 토지·관직 하사<br>★ 견제책: **사심관** 제도, **기인** 제도 |
| **민족 융합** | 옛 신라와 후백제 출신 세력을 지배 세력으로 수용 / 발해 유민 적극 포용 |
| **북진 정책 (고구려 계승)** | **서경** 중시(남쪽 인구 이주, 관부·관리 설치), **거란** 배척<br>⇒ 영토 확장: 청천강 ~ 영흥만 지역까지 확장 |
| **제도 정비** | 정계, 계백료서: 국왕과 신하 간의 관계 규정<br>**훈요 10조**: 후대 왕들이 지켜야 할 정책의 기본 방향 제시 |

**훈요 10조 주요 내용**
| 내용 | 조항 |
|---|---|
| 불교 장려 | 1조, 6조 |
| 풍수지리설 존중 | 2조 |
| 북진 정책 | 4조, 5조 |
| 중국 문화의 주체적 수용 | 4조 |

### 정종 (945~949)
- **왕규의 난(945년)**: 혜종(943~945) 대신 자신의 외손자를 왕위에 세우고자 함
  - → 서경의 왕식렴이 진압, 혜종의 이복동생인 왕요(정종) 추대
- **서경 천도 추진**: 왕위 불안 해소 + 후원자인 왕식렴의 근거지 ↔ But, 중단

### 광종 (949~975)
- ★ (② **노비안검법**) 실시: 호족의 경제력 및 군사력 약화 + 양인 수 증가(→ 국가 재정 기반 확대)
- (③ **과거제**) 실시(쌍기 건의): 유교적 지식과 능력을 지닌 인재 선발
  - → 신진 인사 등용을 통한 신구 세력 교체 + 호족의 관료화
- 공복 색깔을 정하여 관리의 위계질서 세움
- (손글씨 메모) **공신과 호족 숙청**
- **칭제건원(稱帝建元)**: **황제** 호칭, **연호**(광덕, 준풍 등) 사용

### 성종 (981~997)
- **유교** 정치 이념 확립 노력 (← **최승로**의 (④ **시무 28조**) 수용)
  - 제7조: **지방관**(12목) 파견 → 중앙 집권 체제 강화
  - 제13조: **불교** 행사 억제(연등회 축소, 팔관회 폐지 등)
  - 제20조: **유교** 정치사상을 통치의 근본이념으로 삼음
- 중앙 및 지방 관제 정비: 2성 6부의 중앙 관제 마련, **향리 제도** 마련(지방), 과거제 정비, 유학 교육 장려 등

## MEMO
- **사심관 제도**: 중앙의 관리를 출신 지역의 사심관으로 임명하여 지방을 통제하도록 한 제도
- **기인 제도**: 지방 호족의 자제를 볼모로 삼아 수도에 두고 출신지의 일에 대하여 자문하게 한 제도
- **노비안검법**: 혼란기에 불법으로 노비가 된 자를 조사하여 양인으로 풀어준 제도

# Ⅲ. 고려의 성립과 변천 — 1. 고려의 건국과 정치 변화 (p.80~81)

> 원본: \`KakaoTalk_20261107_114152237_01.jpg\` (학습지 2쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ② 통치 체제를 정비하다

### 중앙 정치 제도
| 기구 | 내용 |
|---|---|
| (① **2성 6부**) | 당의 3성 6부와 송의 제도(중추원·삼사) 수용 → **고려** 실정에 맞게 조정<br>- **중서문하성**(장관: 문하시중): 최고 관청, 정책 논의 및 결정<br>- **상서성**: 6부 통솔, 정책 집행<br>- 6부(이부, 병부, 호부, 형부, 예부, 공부): 실무 담당 |
| **중추원** | 국왕 비서 기관, 추밀+승선 / 군사 기밀, 왕명 전달, 궁궐 숙위 등 |
| **어사대** | 관리들의 비리 감찰, 풍기 단속 |
| **삼사** | 국가 재정의 출납과 회계 담당 |
| **도병마사, 식목도감** | 중서문하성과 중추원의 고위 관료로 구성<br>도병마사(국방·군사 문제 논의), 식목도감(제도와 시행 규칙 제정)<br>⇒ 고려의 **독자성** 및 **귀족 정치**의 특징 |

### 지방 행정 제도
| 구분 | 내용 |
|---|---|
| 정비 | 성종: **12목**에 지방관 파견, **3경** 체제 마련<br>현종: 전국을 5도·양계·경기(수도 개경과 주변 지역)로 구분 |
| 이원적 구조 | **5도**: 일반 행정 구역, **안찰사** 파견(도내 순찰) → 주·군·현 설치<br>**양계**: 군사적 행정 구역, **병마사** 파견 → 주·군·현·진 설치 |
| 주현과 속현 | 지방관이 파견된 **주현**이 지방관이 파견되지 않은 **속현**과 특수 행정 구역 통솔<br>**향리**: 행정 실무 담당(조세·공물 징수, 요역 징발 등)<br>특수 행정 구역: **향, 부곡, 소** 설치 |

### 군사 제도
| 구분 | 내용 |
|---|---|
| 중앙군 | **2군**(국왕의 친위 부대), **6위**(수도·국경 방어 담당) |
| 지방군 | **주현군**(5도, 일종의 예비군), **주진군**(양계, 상비군) |

### 교육 제도 및 관리 등용 제도
| 구분 | 내용 |
|---|---|
| 교육 기관 | 태조: 개경과 서경에 학교 설치<br>성종: 국자감(개경), 향교(지방) 설치 |
| **과거제** | 종류: **제술과·명경과**(문관 선발), **잡과**(기술관 선발), **승과**(승려에게 승계 부여 / 교종선, 선종선)<br>응시자격: 법적으로는 **양인** 이상 가능<br>특징: **무과**는 거의 시행하지 않음(무예가 뛰어난 사람을 무관으로 임명) |
| **음서** | 왕족과 공신의 후손, 5품 이상 고위 관리 자손에게 시험 없이 관직 부여<br>→ 고위 관료로 승진 가능, 관료의 지위 세습 가능<br>⇒ **귀족** 사회 유지 수단으로 기능 |
| 토지 제도 | (② **전시과**): 모든 관리에게 수조권이 설정된 토지를 줌 → 관리 사망 시 국가에 **반납**<br>**공음전**: 5품 이상의 관리에게 주는 세습 가능한 토지 |

## MEMO
- **재신과 낭사**: 중서문하성의 재신은 2품 이상의 고위 관리로 국가 중요 정책을 의논하고 결정하였으며, 낭사는 3품 이하의 관리로 언론 부문을 담당함
- **추밀(추신)과 승선**: 중추원의 추밀은 군사 기무를, 승선은 왕명 출납을 담당함
- **대간의 권한**: 중서문하성의 낭사와 어사대의 관원은 대간으로 불렸음. 대간은 왕의 잘못을 논하는 간쟁, 잘못된 왕명을 시행하지 않고 되돌려 보내는 봉박, 관리 임명과 법령 개폐에 동의하는 서경 등의 권리를 행사함
- **고려의 3경**: 개경, 서경, 동경(경주)이었다가 후기에 동경은 남경(서울)로 변화함
- **호족과 향리**: 고려 시대에 각 지역에 지방관(수령)이 파견되면서, 호족들은 점차 수령을 보좌하고 행정 실무를 맡는 향리로 변화해 감. 그러나 모든 군현에 수령을 파견하지는 못하였으며, 주현보다 속현이 더 많았음
- **고려의 학교**: 고려는 유학 교육을 중시하여 개경에 국자감을 설치하고, 주마다 향교를 설립함. 국자감의 유학 교육을 담당한 국자학, 태학, 사문학에는 각각 3품, 5품, 7품 이상 관리의 자제가 입학하였고, 기술 교육을 담당한 율서산학에는 양민 이상의 자제면 입학할 수 있었음
- **음서제의 혜택**: 성종 때 공신 이외에 5품 이상 관리 전체를 대상으로 확대됨. 고위 관리의 경우 아들, 손자 이외에 사위, 조카, 외손자까지 혜택을 받음

# Ⅲ. 고려의 성립과 변천 — 1. 고려의 건국과 정치 변화 (p.82~85)

> 원본: \`KakaoTalk_20261107_114152237_02.jpg\` (학습지 3쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ③ 정치 질서가 동요하고 무신 정권이 성립하다

### (1) 이자겸의 난
| 구분 | 내용 |
|---|---|
| 배경 | 문벌의 보수화 + **경원 이씨**와 왕실의 거듭된 혼인 관계<br>※ 문벌(귀족): 지방 호족과 신라 6두품 출신의 유학자(=문신(文臣))<br>→ 중앙 정계 진출, 여러 세대에 걸쳐 고위 관리 배출<br>⇒ 과거와 음서로 주요 관직 독점 + 왕실 및 문벌과 **혼인**<br>(대표 문벌 귀족: 경원 이씨(이자겸), 파평 윤씨(윤관), 해주 최씨(최충), 경주 김씨(김부식) 등) |
| 과정 | (① **이자겸**)의 권력 독점<br>→ 인종과 측근 세력의 이자겸 제거 시도<br>→ 이자겸과 척준경의 반격(이자겸의 난, 1126년), 이자겸의 권력 장악, 금(여진)의 사대 요구 수용<br>→ 인종이 척준경을 통해 이자겸 제거, 탄핵으로 척준경 축출, But 왕실 권위 떨어짐 |

### (2) 묘청의 서경 천도 운동
| 구분 | 내용 |
|---|---|
| 배경 | 인종의 개혁 추진(왕권 회복 및 민생 안정·국방력 강화 목적)<br>→ 개혁적 문벌과 서경 출신 관료(정지상 등)들이 보수적 문벌을 견제하고 (② **묘청**)을 천거하여 개혁 추진<br>**서경 세력**(정지상, 묘청 등): **칭제 건원**, **서경** 천도(풍수지리설), **금** 정벌 주장 |
| 과정 | 인종이 묘청의 주장에 동조하여 서경에 대화궁 축조 및 팔성당 설치<br>→ 김부식 등 개경 세력의 반대<br>→ 묘청 등이 서경에서 반란을 일으킴(국호 대위, 연호 천개 / 1135년)<br>→ **김부식** 등이 관군을 이용하여 반란 진압 |

### (3) 무신 정변의 발생
| 구분 | 내용 |
|---|---|
| 배경 | 이자겸의 난 및 묘청의 서경 천도 운동 이후 정치 질서 동요 및 **왕권 약화**<br>의종의 실정: 개혁 정치의 좌절로 사치와 향락에 빠짐<br>문벌의 권력 독점과 부패 → **문신** 우대 + **무신**에 대한 차별 대우<br>⇒ 하급 군인의 불만 고조(군인전 미지급, 공사 동원 등) |
| 전개 | 정중부, 이의방 등이 보현원 연회를 계기로 정변을 일으킴<br>→ 문신 제거, 의종 폐위 ⇒ **무신 정권의 성립(1170년~1270년)** |
| 무신 정권 — 초기 | 이의방·정중부 등 정권 장악: (③ **중방**)을 통해 권력 행사<br>무신 간의 권력 다툼으로 국정 및 사회적 혼란 → 농민·천민의 봉기 빈번 |
| 무신 정권 — **최씨 정권** | **최충헌의 집권**<br>- (④ **교정도감**) 설치: 정책 결정, 반대 세력 감시<br>- **도방** 확대: 호위 강화, 농민 봉기 탄압<br>**최우의 집권**<br>- **정방** 설치: 인사 행정 담당<br>- **서방** 설치: 능력 있는 문인들에게 정책 자문 → 문신 등용<br>- **야별초** 조직: 군사적 기반 |

### (4) 농민과 천민의 봉기
| 구분 | 내용 |
|---|---|
| 배경 | 무신들의 권력 다툼으로 인한 정치 혼란 및 신분 질서 동요<br>**무신**들의 백성 수탈 심화(농장 확대, 세금 과다 수취 등)<br>**신분 상승**에 대한 기대감 고조(이의민 등) |
| 과정 | **망이·망소이의 난**(1176년, 공주 명학소): 과도한 세금 부담 반발<br>**김사미와 효심의 난**(1193년, 운문과 초전): 연합 전선(농민+경주) 형성<br>**전주 관노의 난**(1182년, 전주): 지방관 횡포에 불만<br>**만적의 난**(1198년, 개경, 최충헌의 사노비): **신분 해방** 시도 → 실패<br>삼국 부흥 운동: 신라 부흥 운동(경주), 고구려 부흥 운동(서경) 등 |
| 의의 | **불평등**에 대한 항거, **하층민**의 의식 성장 |

## MEMO
- **이자겸의 권력 장악**: 이자연(祖父)-이호(父)-이자겸으로 이어지는 3대 동안 경원 이씨 가문은 왕실과의 혼인을 통해 10명의 왕비를 배출하여 권력을 장악함. 특히 이자겸은 자신의 둘째 딸을 예종과, 셋째, 넷째 딸을 인종(이자겸의 외손자)과 혼인시킴으로써 당대 최고의 권력을 누렸다가 사돈인 척준경에 의해 제거됨

- **서경 세력 VS 개경 세력**

| 서경 세력 | 개경 세력 |
|---|---|
| 묘청, 정지상 | 김부식 |
| 풍수지리설 | 유교 사상(사대적) |
| 서경 천도 주장 | 서경 천도 반대 |
| 금 정벌 주장 | 금 사대 주장 |
| 고구려 계승 의식 | 신라 계승 의식 |
| 자주성 강조 | 중국 중심의 국제 질서 인정 |

- **문신과 무신의 차별**: 고려 시대 무신은 정3품인 상장군까지만 승진할 수 있었으며, 2품 이상 고위 관직에는 문신이 임명되었음. 심지어 군대의 총사령관도 문신이 맡음
- **무신 정권**: 초기 무신 정권은 일명 하극상의 시대로서, 이의방(1170~1174)에 이어 같이 무신 정변을 일으킨 정중부(1174~1179)가 권력을 탈취하고, 그의 부하였던 경대승(1179~1183)이 다시 권력을 장악함. 경대승이 죽자 그의 부하인 이의민(1183~1196)이 권력을 차지함. 천민 출신이었던 이의민이 최충헌에 의해 제거된 후 1196년부터 1258년까지 최충헌 - 최우 - 최항 - 최의로 이어지는 4대 60여 년간의 최씨 정권이 성립되어 사회가 다소 안정됨. 몽골 침입 시 주화(主和)파에 의해 최의가 제거되면서 무신 정권도 몰락함

# Ⅲ. 고려의 성립과 변천 — 2. 고려의 대외 관계 (p.86~91)

> 원본: \`KakaoTalk_20261107_114152237_03.jpg\` (학습지 4쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 거란과 여진의 침입을 막아 내다

### (1) 거란의 침입과 격퇴
※ 10세기 초 동아시아의 정세(당 멸망 후)
- 거란의 요(遼) 건국(916년) → 한(漢)족의 송(宋) 건국(960년), 요와 송의 대립
- → 고려는 거란(요) 견제(북진 정책) + 송과 우호적 관계(송: 거란 견제)

| 구분 | 내용 |
|---|---|
| 1차 침입 (993년) | 배경: 고려의 친송 정책 + 북진 정책<br>경과: 거란(소손녕)의 고려 침략(993년) → (① **서희**)의 외교 담판으로 **강동 6주** 확보 |
| 2차 침입 (1010년) | 배경: 강조의 정변을 구실로 침략<br>경과: 개경 함락 → 강화 후 물러남 |
| 3차 침입 (1019년) | 배경: 거란의 요구(고려 국왕 방문, 강동 6주 반환)를 고려가 거절<br>경과: 개경 부근까지 침략 → **강감찬**의 (② **귀주대첩**)으로 격퇴<br>결과: 개경에 **나성**, 국경 일대에 **천리 장성** 축조로 침략 대비, 고려·요·송의 세력 균형 유지 |

### (2) 여진 정벌과 동북 9성의 축조
| 구분 | 내용 |
|---|---|
| 여진 정벌 | **초기 고려-여진 관계**: 부족 단위 생활, 토산물을 바치며 고려에 복속 요청 → 고려를 부모의 나라로 섬김, 고려는 회유 정책 실시<br>**고려의 여진 정벌**: 12세기 완옌부를 중심으로 강성해져 고려 동북쪽 국경 지대 침략<br>→ (③ **윤관**)의 건의로 **별무반** 편성, 정벌 후 **동북 9성** 축조(1107년)<br>→ 여진 요구(조공 약속), 방어 곤란으로 9성 반환(1109년) |
| 여진의 침략 | **여진의 성장**: 여진의 금(金) 건국(1115년) → 황제를 칭하며 고려에 형제 관계 요구 → 고려 조정의 반대 여론<br>**경과**: 금의 요 멸망(1125년) + 송 공격(1127년, 북송→남송 축소) → 고려에 **사대 관계** 요구 → **이자겸** 등 집권 세력이 전쟁 회피와 정권 유지 위해 수용<br>**결과**: 고려의 북진 정책 중단 + 자주성 손상 |

## ② 주변 국가와 활발하게 교류하다

**국제 무역항: (④ 벽란도)**

| 나라 | 내용 |
|---|---|
| **송** | 가장 **활발** → 문화적·경제적 실리 추구<br>송의 제도를 참고하여 제도 정비, 선진 문물 수용 → **초조대장경** 간행, **청자** 제작, 음악 발달 등<br>(송: 거란, 여진 등 주변 민족 견제)<br>수입: 왕실과 귀족의 수요품(비단, 서적, 약재 등)<br>수출: 나전 칠기, 화문석, 종이, 인삼 등 |
| **거란** | 거란 침입 격퇴 후 정기적 사신 파견<br>수입: 은, 모피 등 / 수출: 농기구, 곡식 등<br>**대장경**: 고려의 대장경 편찬에 도움 |
| 여진 | 수입: 말, 화살 등 / 수출: 식량, 농기구 등 |
| 일본 | 수입: 수은, 향료 등 / 수출: 식량, 인삼, 책 등 |
| **아라비아** | 수입: 수은, 향료, 산호 등 / 수출: 금, 비단 등<br>→ **코리아**의 이름이 서방 세계에 알려짐 |

## MEMO
- **서희의 외교 담판**: 서희는 거란의 침략 의도가 송과의 외교 관계 단절에 있다고 파악하고, 고려가 송과의 교류를 단절하고 거란과 교류할 것을 약속하는 대신 압록강 동쪽의 강동 6주를 획득함. 이 때 서희는 고려가 고구려의 계승국이고, 여진이 가로막고 있어 거란과 국교를 맺기 힘들다는 논리를 내세움
- **강조(?~1010)**: 고려 제7대 목종(997~1009)의 어머니 천추 태후의 외척인 김치양이 권력을 잡고 횡포가 심해지자, 1009년 정변을 일으켜 김치양 부자를 처형함. 병약한 목종마저 시해하고 현종(1009~1031)을 임금으로 내세워 세력을 떨쳤다가, 1010년 거란의 성종이 신하로서 임금을 시해한 것을 문책한다는 구실로 40만 대군을 이끌고 침입해 오자 맞아 싸우다가 사로잡혀 죽음
- **별무반**: 여진과의 전투에서 매번 기병에게 패하자, 윤관의 건의로 만든 특수군. 신기군(기병), 신보군(보병), 항마군(승군)으로 편성됨

# Ⅲ. 고려의 성립과 변천 — 3. 몽골의 간섭과 고려의 개혁 (p.92~99)

> 원본: \`KakaoTalk_20261107_114152237_04.jpg\` (학습지 5쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 몽골의 침략을 극복하다

| 구분 | 내용 |
|---|---|
| 몽골의 성장과 접촉 | **몽골의 성장**: 몽골족의 칭기즈 칸이 몽골 제국 수립(1206년) → 금 공격하여 북중국 점령<br>**고려와 몽골의 접촉**: 거란족 일부가 몽골에 쫓겨 고려로 침입 → 여·몽 연합군이 거란족 토벌 |
| 몽골의 침략 — 배경 | 몽골의 거란족 토벌에 대한 무리한 공물 요구<br>몽골 사신 저고여의 피살(1225년) |
| 몽골의 침략 — 경과 (1231년~1270년) | **1차 침략(1231년)**: 개경 포위, 고려 화의 요청 → 고려(**최우**)의 **강화** 천도(1232년): 장기 항전 준비<br>**2차 침략(1232년)**: 처인성 전투(**김윤후**의 살리타 사살, **하층민**의 적극적 항쟁)<br>**3차 침략(1235년~1238년)**: **황룡사 9층 목탑** 소실, (① **팔만대장경**) 제작(1236~1251)<br>4차 침략(1251년), 5차 침략(1254년), 6차 침략(1255년), 7차 침략(1257년)<br>⇒ 국토 황폐화, 인명 피해, 중앙의 통제력 약화<br>**최씨 정권 붕괴**(최의 피살, 1258년) → 독립과 풍속을 유지하는 조건으로 강화 체결 후 **개경 환도**(1270년) |
| (② **삼별초**)의 항쟁 | 몽골과의 강화 및 환도에 반대하여 대몽 항쟁 지속 → 여·몽 연합군에 의해 제주도에서 진압(1273년) |

## ② 원의 내정 간섭에 맞서 개혁 정치를 펴다

### (1) 원의 내정 간섭
- **영토 축소**: (③ **쌍성총관부**)(화주), 동녕부(서경), 탐라총관부(제주)를 설치하고 직접 지배
- **내정 간섭**: **정동행성**(일본 원정 실패 이후 유지)을 통한 내정 간섭
  - 원의 **부마국**화 → 고려의 왕실 호칭과 관제 **격하**
- **경제적 수탈**: 일본 원정에 필요한 군대와 물자 강요, 조공 명목으로 물품과 인력 수탈(금·인삼·매 등, **공녀**와 환관)
- **문화적 교류**: 고려에서 **몽골풍** 유행, 원에 **고려양** 전래

### (2) 권문세족의 성장과 공민왕의 개혁 정치
- (④ **권문세족**)(친원파)의 성장: 원나라에 기대어 권력을 누리는 원 간섭기의 새로운 지배계급
  - 고위 관직 독점 및 권력 세습(음서), 막대한 **농장**과 노비 소유 → 국가 재정 궁핍
- **공민왕의 개혁 정치**

| 구분 | 내용 |
|---|---|
| 배경 | 원·명 교체기를 이용하여 개혁 추진 |
| 내용 — 자주성 회복 | 친원 세력 제거: 기철 일파 숙청<br>정동행성(이문소) 폐지<br>쌍성총관부 공격 → 철령 이북의 땅 점령<br>왕실 호칭 및 제도 복구, 몽골풍 금지 |
| 내용 — 내정 개혁(=왕권 강화) | 신돈 등용 → (⑤ **전민변정도감**) 설치<br>(권문세족이 빼앗은 토지와 노비를 본래 주인에게 돌려주고 강제로 노비가 된 사람들을 해방시킴)<br>성균관 정비, 유학교육 강화 → **신진 사대부** 성장 |
| 결과 | 홍건적·왜구의 침입 + **권문세족**의 반발 → 신돈 제거, 공민왕 시해로 실패 |

## ③ 새로운 정치 세력이 성장하고 고려가 멸망하다

| 구분 | 내용 |
|---|---|
| 새로운 세력의 성장 — (⑥ **신진 사대부**) | 원 간섭기 등장(대부분 하급 관리나 지방 향리의 자제)<br>→ 성리학 공부, 과거 급제로 관직 진출 ⇒ 공민왕 시기 성장<br>권문세족의 비리 비판, 개혁 주장 |
| 새로운 세력의 성장 — **신흥 무인 세력** | **홍건적**과 **왜구**의 격퇴 과정에서 성장<br>대표 세력: **최영, 이성계** 등 |
| 고려의 멸망 | 원 혼란기에 주원장이 명(明) 건국(1368년), 명이 철령 이북의 영토 요구(1388년)<br>→ 우왕과 최영의 요동 정벌 추진<br>→ **위화도 회군**: 요동 정벌을 반대한 이성계가 회군, 개경 장악, 최영 제거, 우왕·창왕 폐위 후 공양왕 옹립<br>→ 신진 사대부의 분열: **온건파**(고려 유지-정몽주) VS **급진파**(왕조 교체-정도전)<br>→ 이성계와 **급진파** 사대부의 연계: 개혁 추진, 권문세족 약화, 정몽주 등 제거<br>→ 공양왕이 이성계에게 왕위 넘김, **조선 건국**(1392년) |

## MEMO
- **삼별초의 항쟁**: 도방과 함께 최씨 정권의 군사적 기반이었던 삼별초는 야별초에서 분리된 좌별초와 우별초, 신의군(몽골 포로 탈출)을 일컬음. 고려의 개경 환도 후 지도자인 배중손을 중심으로 항전을 결정하고, 강화도에서 진도로, 진도에서 제주도로 이동하여 몽골 항전을 지속하였음
- **몽골 제국의 금·남송 정복**: 몽골 제국이 금의 수도를 함락(1233년)시키자, 남송은 몽골 제국과 연합하여 금을 멸망시킴(1234년). 이후 남송의 조약 위반으로 몽골이 남송을 멸망시킴(1279년). 그 과정에서 몽골 제국의 5대 대칸인 쿠빌라이가 몽골 제국의 국호를 '대원(大元)'으로 변경함(1271년)
- **고려의 관제 및 호칭 격하**: 원 간섭기에 고려의 관제는 2성에서 첨의부로, 6부에서 4사로, 중추원에서 밀직사로 격하되었으며, 호칭 또한 조·종은 왕(왕의 명칭도 충~으로 불림), 짐(朕)은 고, 폐하는 전하, 태자는 세자로 격하됨
- **정동행성**: 원이 일본 정벌을 위해 고려에 설치(1280년)한 기관. 일본 정벌이 실패하였음에도 공민왕 때까지도 지속되어 내정간섭의 도구로 활용됨
- **도평의사사**: 고려 후기의 최고 행정 기구로, 무신 정변 이후 도병마사의 기능이 확대되면서 명칭이 바뀜
- **홍건적의 난**: 원 말기에 일어난 한족의 반란으로, 원나라에 쫓겨 1359년과 1360년에 고려를 침공하여 개경 함락, 공민왕 암살 등의 위기가 있었음

# Ⅳ. 조선의 성립과 발전 — 1. 통치 체제와 대외 관계 (p.114~121) ①

> 원본: \`KakaoTalk_20261107_114152237_05.jpg\` (학습지 6쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 조선이 성립하고 국가의 기틀을 마련하다

### (1) 조선의 건국
| 구분 | 내용 |
|---|---|
| 위화도 회군 이후 | 이성계와 (① **정도전**) 등 급진파 사대부들의 협력<br>→ 과전법 실시: 전·현직 관료에게 경기 지역의 토지에 한하여 수조권이 설정된 토지(과전)를 준 제도 |
| 이성계의 건국 | 국호: 조선, 도읍: 한양<br>→ 한반도의 중앙에 위치<br>→ 남쪽으로 한강이 흘러 육로와 수로 교통 편리, 산으로 둘러싸여 있어 외적을 막기에 유리<br>(② **급진파 신진 사대부**)들이 성리학을 통치 이념으로 삼음<br>→ 재상정치: 현명한 재상이 정치를 이끌어야 한다고 주장<br>→ 왕도정치: 백성을 근본으로 여기고 인격과 덕으로 백성을 다스리는 정치 강조 |
| 사회변화 | 유교 윤리가 정치, 경제, 사회, 문화 전반에서 중심이 됨<br>불교는 위축 |

### (2) 국가 기틀의 마련
| 왕 | 내용 |
|---|---|
| **태종** | 이방원이 두 차례 왕자의 난을 통해 즉위<br>국왕 중심의 정치 실시<br>→ 사병혁파: 군권장악<br>→ 호적조사와 (③ **호패법**) 실시: 세금징수와 군역부과의 기초 자료 |
| **세종** | 유교 정치 실시를 위해 노력<br>→ 집현전 설치: 학문연구, 왕의 정치에 자문, 훈민정음 창제 지원<br>→ 의정부 권한 강화(신하들의 권력과 왕권의 조화 추구)<br>→ 경연 실시: 왕과 신하들이 함께 공부하는 제도, 학문과 정치 논의 |
| **세조** | 조카인 단종을 몰아내고 즉위<br>→ 집현전 폐지, 경연 중지, 의정부 권한 약화<br>직전법 실시: 현직 관리에게만 수조권을 주는 제도 |
| **성종** | 홍문관 설치: 집현전을 계승, 경연 재개<br>의정부 권한 강화<br>(④ **경국대전**)의 완성: 조선의 기본 법전, 이·호·예·병·형·공의 6전으로 구성 |

## ② 유교 이념에 따라 통치 체제를 정비하다

### (1) 중앙정치기구
| 기구 | 내용 |
|---|---|
| 의정부 | 3정승이 국왕을 보좌하여 정책을 심의, 결정(국정 총괄) |
| 6조 | 행정 실무를 담당 |
| 3사 | 권력의 독점과 부정을 방지하는 언론기관<br>→ 사헌부: 관리의 잘못 감찰<br>→ 사간원: 국왕이 올바른 일을 하도록 조언<br>→ 홍문관: 국왕의 정책 자문과 경연 담당 |
| 기타 | 승정원(왕의 비서 기구)<br>의금부(중죄인 처벌)<br>춘추관(역사서 편찬)<br>성균관(유학교육)<br>한성부(수도의 행정과 치안 담당) |

### (2) 지방행정제도와 군사제도
| 구분 | 내용 |
|---|---|
| 8도 | 관찰사 파견(수령 지휘, 감독) |
| 군현 | 수령 파견(군현 관리), 향리(수령 실무 보좌) |
| 유향소 | 지역 양반(수령 보좌, 향리 감시) |
| 군역제도 | 16~60세의 양인 남자들이 직접 군인으로 복무, 군인 비용 부담<br>중앙에 5위를 두어 한양과 궁궐 수비<br>봉수제 정비: 밤에는 횃불, 낮에는 연기를 통해 변방 지역의 위기 상황을 중앙에 알리는 통신 제도 |

## MEMO
- **정도전**: 조선의 설계자. 이성계와 함께 새로운 나라를 구성. 『조선경국전』, 『불씨잡변』 등을 저술. 명나라의 건국 초기 조선을 압박해오자 요동을 정벌하자고 주장하기도 함. 재상중심의 정치를 강조했으며 이에 태종 이방원과 갈등. 1차 왕자의 난 때 죽임을 당함
- **집현전과 사가독서제**: "공부에만 집중해!"라며 집에서 푹 쉬면서 책만 읽을 수 있는 유급 휴가
- **조선의 중앙 기구** (그림)
  - 왕 아래 의정부 → 6조
    - 이조: 문관 인사 / 호조: 국가 재정, 세금 징수 / 예조: 교육, 과거, 외교, 제사 / 병조: 무관 인사, 국방 / 형조: 형벌, 소송 / 공조: 산림, 건설, 수공업
  - 승정원, 의금부
  - 3사: 사헌부, 사간원, 홍문관
  - 한성부, 춘추관, 성균관
- **향리의 권력 변화**: 고려시대까지 향리는 지방의 세력가였으나 조선시대부터는 하급 관리가 되어 지위가 낮아짐

# Ⅳ. 조선의 성립과 발전 — 1. 통치 체제와 대외 관계 (p.114~121) ②

> 원본: \`KakaoTalk_20261107_114152237_06.jpg\` (학습지 7쪽)
> 이 쪽에는 빈칸이 없음

## ② 유교 이념에 따라 통치 체제를 정비하다 (이어서)

### (3) 교육 제도와 관리 등용 제도
| 구분 | 내용 |
|---|---|
| 교육제도 | 서당: 기초적인 유교적 지식 전달<br>4부학당, 향교: 유교 경전을 가르침<br>성균관: 최고 교육기관 |
| 관리 등용 제도 — **과거** | **문과** → 문관을 선발<br>→ 소과와 대과: 소과에 생원과(유교경전 내용 시험), 진사과(글 작문 실력 평가). 소과에 합격하면 성균관에 입학할 수 있고, 대과 시험을 볼 수 있었음<br>**무과** → 무관을 선발: 병서와 무예 실력을 평가<br>**잡과**: 기술관을 선발<br>과거시험은 주된 관리 선발 방식으로 천민이 아니면 과거 시험에 응시 가능. 문과는 주로 양반, 잡과는 중인 층이 많이 응시 |
| 관리 등용 제도 — **음서** | 고려에 비해 범위가 줄고, 과거에 합격하지 못하면 낮은 관직에 머묾 |
| 관리 등용 제도 — **천거** | 관리들의 추천을 받아 개인의 능력을 기준으로 관리를 선발하는 제도 |

## ③ 사대교린으로 외교적 안정과 실리를 취하다

> (손글씨 메모) **사대 → 명 / 교린 → 여진, 일본**

### (1) 명과의 사대 관계
| 구분 | 내용 |
|---|---|
| 조선 외교의 기본 방침 | 큰나라를 섬기는 **사대**와 이웃나라와 가깝게 지내는 **교린**에 바탕 |
| 내용 | 해마다 명에 사신을 보내 조공품(말, 인삼)을 바침<br>명으로부터 답례(약재, 서적) 등 답례품을 받음 |
| 성격 | 명으로부터 선진문물을 받아들이고 국제적 지위를 인정받음 |

### (2) 주변국과의 교린 관계
| 구분 | 내용 |
|---|---|
| 교린 | 이웃 국가와 대등한 의례를 나누는 것. 조선 시대의 교린 관계는 중국을 제외한 주변국과의 교류를 의미 |
| **여진** | 국경지역 무역소를 통해 제한적 교류 허용<br>귀화장려: 귀화한 여진족에게 토지와 관직을 줌<br>**4군 6진 개척**: 세종시기 최윤덕을 파견하여 4군 개척, 김종서를 통해 6진 개척, 오늘날과 같은 국경선 형성 |
| **일본** | **대마도 정벌**: 세종 시기 이종무를 보내 정벌<br>**3포 개항**: 제포(창원, 진해), 염포(울산), 부산포를 개항해 제한적 무역 허가<br>왜관을 중심으로 교류<br>**삼포왜란**: 조선 정부가 무역 통제를 강화하자 이에 반발한 3포의 일본인들이 반란을 일으킴 |
| 기타 | 시암(태국), 자와(인도네시아), 류큐(오키나와) 등과도 교류<br>이들은 각종 토산품을 가져왔고 조선은 문방구, 불교, 유교 경전을 전해줌 |

## MEMO
- **성균관 유생들의 생활**: 성균관에 입학하면 학생들은 기숙사에서 생활. 수시로 시험을 보았고 300일 이상 출석해야 문과(대과)에 응시할 수 있는 자격이 주어짐
- **과거합격 얼마나 높은 경쟁률이었을까?**: 과거시험은 3년에 한번 치러졌고 최종적으로 33명만 선발되었음. 소과 시험에 많은 유생들이 몰리기 때문에 최종 33인에 포함될 확률은 0.03% 정도였다고 함. 정조대 실시된 특별 시험에서는 10,000:1까지 경쟁률이 치솟음
- **조선 전기의 대외 관계** (지도): 명과는 사대 관계(조공 ↔ 답례), 여진·일본과는 교린 관계. 북쪽 국경에 4군(압록강 쪽)과 6진(두만강 쪽), 남쪽에 3포(제포·염포·부산포) 개항, 대마도 정벌 표시

# Ⅳ. 조선의 성립과 발전 — 2. 사림 세력과 정치 변화 (p.122~127) ①

> 원본: \`KakaoTalk_20261107_114152237_07.jpg\` (학습지 8쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 사림이 정치 세력으로 성장하다

### (1) 훈구의 권력 독점
| 구분 | 내용 |
|---|---|
| 형성 | 조선의 건국, 국왕 즉위에 기여한 공신<br>→ (① **한명회**) 등 세조의 즉위에 기여한 사대부들이 정치를 주도 |
| 성장 | 국가로부터 많은 토지와 노비를 받음<br>왕실과의 혼인 관계를 통해 권력을 독점 |

### (2) 사림의 정계 진출
| 구분 | 내용 |
|---|---|
| 형성 | 조선의 건국에 참여하지 않고 지방에서 학문연구와 교육에 힘쓴 사대부<br>→ 정몽주, 길재 등 온건파 사대부들의 학풍을 계승<br>→ 왕도 정치와 향촌자치를 주장 |
| 성장 | 성종 시기 훈구 세력을 견제하기 위해 등용<br>→ (② **김종직**)을 비롯한 영남 출신의 사림 등용<br>→ 3사에 등용되어 훈구의 부정행위와 권력 독점 비판<br>사림과 훈구의 갈등 심화 |

### (3) 훈구와 사림의 갈등
**사화**: 사림이 큰 피해를 입은 사건

| 사화 | 내용 |
|---|---|
| **무오사화 (1498)** | 배경: 김종직의 조의제문<br>→ 훈구 세력이 김종직이 단종을 몰아낸 세조를 의제를 몰아낸 항우에 빗대어 비판했다고 주장<br>연산군과 훈구세력이 손 잡고 사림을 제거 |
| **갑자사화 (1504)** | 배경: 연산군의 어머니(폐비 윤씨) 사건과 관련된 사림들이 제거 됨<br>→ 훈구와 사림 세력이 모두 피해<br>이후 중종반정으로 중종이 즉위. 연산군은 왕위에서 쫓겨남<br>훈구의 힘이 세지자 중종은 (③ **조광조**)를 비롯한 사림 세력을 등용함 |
| **기묘사화 (1519)** | 배경: 조광조의 급진적인 개혁<br>→ **소격서 폐지**: 왕실의 도교 행사를 주관하던 관청 폐지<br>→ (④ **현량과**) 실시: 학문이 뛰어난 인재를 추천하여 등용. 과거 시험 없이 사림들이 대거 정계에 진출 가능<br>→ 공신의 위훈 삭제 주장: 중종이 왕위에 오를 때 부당하게 왕위에 오른 사람들의 자격을 박탈해야함을 주장<br>급진적인 개혁 정책에 부담을 느낀 중종과 훈구 세력이 조광조와 사림 세력을 제거 |
| **을사사화 (1545)** | 배경: 명종 시기 외척들 간의 권력 다툼<br>→ 중종 이후 차례대로 왕위에 오른 인종과 명종의 외삼촌(대윤 vs 소윤)이 다툼을 벌이다가 소윤이 승리. 대윤과 거기에 포함된 사림들이 많이 피해를 봄 |

> (손글씨 암기법) **무**오 → **갑**자 → **기**묘 → **을**사 : "(무) **갑**자기 **기**묘한 **을사**사화가 일어났다"

## MEMO
- **한명회**: 수양대군이 반대파를 숙청하고(계유정난) 왕위에 오르는 데 기여한 공신. 훗날 왕의 장인이 되어 막강한 권력을 누림. 그는 강가에 압구정이라는 정자를 세웠는데 오늘날 압구정동의 이름이 여기서 유래함
- **김종직**: 사림의 중요 인물로 성종 대에 제자들을 많이 등용하여 훈구와의 대립이 깊었음
- **사림의 계보도**
  - 정몽주 → 길재 → 김숙자 → 김종직 → 정여창, 김굉필, 김일손
  - → 이언적, 서경덕, 조광조, 김안국
  - → 영남학파: 조식, 이황 / 기호학파: 이이, 성혼
- **기묘사화에 일어난 기묘한 일**: 조광조의 빠른 개혁에 위기감을 느낀 훈구파는 나뭇잎에 꿀로 '주초위왕(走肖爲王)'이라 쓰고 벌레가 갉아먹게 만들어 "조(趙)씨가 왕이 된다"는 조작 사건을 꾸밈. 이에 조광조의 권력 확대를 경계하던 중종은 나뭇잎 조작을 구실 삼아 기묘사화를 일으켜 조광조와 사림파를 대거 제거. 결국 이 사건으로 조광조는 유배를 떠나 사약을 받고 목숨을 잃었습니다

# Ⅳ. 조선의 성립과 발전 — 2. 사림 세력과 정치 변화 (p.122~127) ②

> 원본: \`KakaoTalk_20261107_114152237_08.jpg\` (학습지 9쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ② 사림이 세력을 키우고 붕당을 형성하다

### (1) 서원의 설립
| 구분 | 내용 |
|---|---|
| 서원 | 사화로 피해를 입은 사림이 지방으로 내려가 유학자 제사, 학문 연구, 교육<br>→ 대표적 서원: 백운동 서원, 병산 서원 등<br>국가에서 서원 설립 장려, 토지와 노비 지급<br>서원을 중심으로 성리학 이념 보급, 정치에 대한 여론을 모음 |

### (2) 향약의 보급
| 구분 | 내용 |
|---|---|
| 향약 | 향촌의 자치 규약<br>중종 때 사림 세력이 중국의 『여씨향약』을 번역하여 보급<br>→ (① **이황**)과 이이 등이 우리 실정에 맞는 향약을 만들어 시행<br>→ 향약의 규약을 잘 지킨 사람에게는 상을 주고, 어긴 사람에게는 벌을 줌<br>→ 서원과 향약을 바탕으로 사림은 향촌에서 영향력을 넓혀 감 |

### (3) 사림의 집권과 붕당의 형성
| 구분 | 내용 |
|---|---|
| 사림의 집권 | 선조 때가 되면 사림들이 정치의 주도권 장악<br>공론을 존중하고 언론 활동을 보장하는 것 강조<br>재야에서 학문을 공부하던 사림(산림)들도 서원 활동을 통해 공론 형성에 참여<br>→ 공론: 일종의 여론을 의미. 여러 사람이 뜻을 같이 하는 것. 사림 집권기의 공론은 붕당 내에서 토론을 거쳐 합의된 의견을 의미 |
| 붕당의 형성 | 정계에 남아 있는 훈구 세력의 처리 문제로 내부 갈등<br>(② **이조 전랑**)의 임명 문제를 놓고 동인과 서인으로 나뉨<br>→ 인사권을 가지고 있었으며 자기 후임자를 추천할 수 있는 막강한 권력을 가지고 있었음<br>**상대 붕당의 입장을 존중하면서 비판과 견제**<br>이후 동인은 남인과 북인으로 나뉨<br>서인은 노론과 소론으로 나뉨 |

**동인 vs 서인**
| | 동인 | 서인 |
|---|---|---|
| 지역 | 영남지역 | 경기, 충청지역 |
| 대표학자 | 이황, 조식 | 이이, 성혼 |

### 붕당의 계보도
\`\`\`
사림 (길재·김종직) ── 선조 초에 분당됨
├─ 서인 (이이·성혼) ── 숙종 초에 분당됨
│   ├─ 노론
│   └─ 소론
└─ 동인 (이황·조식·서경덕) ── 선조 말에 분당됨(1591년)
    ├─ 북인
    └─ 남인
\`\`\`

## MEMO
- **사액서원**: '사액'이란 왕이 서원의 이름이 적힌 현판을 하사하는 것을 말함. 최초의 사액 서원인 백운동 서원은 명종이 직접 쓴 '소수 서원'이라는 현판을 받음
- **이황과 이이**: 이황과 이이는 조선 시대 성리학을 완성한 대표적 학자로, 각각 도덕적 원리(理)와 현실적 실천(氣)을 강조했습니다. 이황은 도덕적 근본을 바로 세우는 것을 중요시하여 《성학십도》를 저술하고 일본 성리학에도 큰 영향을 주었습니다. 반면 이이는 현실의 문제점을 직접 고쳐야 한다고 보아 《성학집요》를 쓰고 '10만 양병설'을 주장했습니다. 이황의 사상은 이후 동인(남인)과 영남학파로, 이이의 사상은 서인과 기호학파로 이어졌습니다. 두 학자의 모습은 각각 1,000원권과 5,000원권 지폐에서 찾아볼 수 있습니다
- **동인과 서인**: 이조 전랑은 이조의 정랑과 좌랑을 함께 이르던 말임. 이조 전랑의 권한은 이조 판서라도 관여할 수 없었음. 대역죄가 아니면 탄핵도 안 받았음. 이조 전랑 자리를 놓고 김효원과 심의겸이 갈등했는데 김효원은 한양의 동쪽에 심의겸은 한양의 서쪽에 살았기 때문에 동인과 서인이라 불림

# Ⅳ. 조선의 성립과 발전 — 4. 왜란·호란의 발발과 영향 (p.134~141) ①

> 원본: \`KakaoTalk_20261107_114152237_09.jpg\` (학습지 11쪽으로 추정 — 쪽 번호가 사진에 안 보임)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 일본의 침략을 막아 내다

### (1) 왜란의 발발
| 구분 | 내용 |
|---|---|
| 16c 중반 이후 동아시아 정세 변화 — 명 | 환관과 외척들의 횡포가 심해짐<br>몽골과 왜구의 침입 → 사회적 불안 심화 |
| 〃 — 조선 | 붕당간의 대립이 심화되는 등 정치적 혼란<br>군역 제도가 문란해지면서 국방력 약화 |
| 〃 — 일본 | 도요토미 히데요시의 전국 시대 통일 → 대륙 진출을 위해 전쟁 준비 |
| 배경 | 일본은 '명을 정벌하러 가는데 길을 빌려 달라'(손글씨: **정명가도**)라는 구실로 조선을 침략(1592.4) |
| 전개 | 부산진, 동래성 함락, 신립의 충주 방어선도 무너짐<br>선조는 광해군을 세자로 책봉하고 의주까지 피란을 감. 명에 지원 요청<br>일본군은 20여일 만에 한성 점령, 평양을 거쳐 함경도 지역까지 올라옴 |

### (2) 의병과 수군의 활약
| 구분 | 내용 |
|---|---|
| 의병의 활약 | (① **곽재우**) 등 유생들이 농민을 모아 의병을 일으킴<br>→ 익숙한 지리를 활용한 전술로 일본군의 보급로를 차단하며 큰 활약<br>유정과 휴정 등 승려들도 승군을 조직하여 대항 |
| 수군의 활약 | 이순신이 이끈 수군이 옥포, 사천, 당포에서 승리<br>(② **한산도 대첩**)의 승리: 서남해의 제해권을 장악<br>→ 곡창 지대인 충청도와 전라도 지방을 지키고 일본군의 해상 보급로 차단 |

- 명은 일본의 대륙 진출을 막기 위해 조선에 지원군을 보냄 → 조선-명 연합군이 평양성 전투에서 승리
- 이후 김시민은 진주성에서, 권율은 행주산성에서 큰 승리를 거둠

### (3) 정유재란
| 구분 | 내용 |
|---|---|
| 발발 | 일본군은 명과 휴전 협상 전개 → 3년에 걸친 휴전 협상이 결렬되면서 정유재란(1597) 발발 |
| 전개 | 휴전 기간 동안 조선은 군제를 개편하고 무기와 성곽을 보강해서 일본의 침략을 효과적으로 막아냄<br>→ 훈련도감 설치, 화포 개량과 조총 제작 등<br>이순신의 명량해전 승리<br>도요토미 히데요시의 사망으로 일본군이 조선에서 철수 |
| 결과 | 이순신이 퇴각하는 일본군을 (③ **노량해전**)에서 무찌르면서 전쟁 종료 |

### (4) 왜란의 영향
| 구분 | 내용 |
|---|---|
| 조선 | 토지 황폐화, 백성의 생활과 국가 재정 어려움<br>많은 사람이 죽고 일본에 끌려가기도 함 → 귀무덤, 코무덤 등<br>궁궐, 사고 등이 불타없어졌고 문화재는 약탈 당함 |
| 일본 | 포로로 끌고간 성리학자, 활자 인쇄공, 도자기 기술자 등을 통해 문화 발전의 계기 마련 → 도공 이삼평이 아리타 도자기 형성에 크게 기여함<br>도쿠가와 이에야스가 에도막부를 열고 조선과 국교 관계 정상화 요청 → 국교 회복을 위해 조선은 (④ **조선 통신사**)를 파견 |
| 명 | 전쟁의 영향으로 국력 약화 → 만주에서 여진족 성장 |

## MEMO
- **난중일기**: 이순신이 왜란 동안 쓴 일기로 전쟁 상황이 상세히 기록되어 있어, 귀중한 자료로 평가 됨. 2013년 유네스코 세계 기록 유산으로 등재되어 있음
- **판옥선의 장점**: 바닥이 평평한 조선의 판옥선은 배의 회전이 쉬워 다양한 전술을 펼칠 수 있었음. 또한 일본의 전선에 비해 튼튼해서 화포를 쏠 때의 충격에 잘 견딤. 판옥선에 지붕을 덮어 거북선을 만들었고 이는 돌격선의 역할을 함. 반면 일본의 전선은 가벼워서 속도는 빨랐지만 포 공격에 쉽게 부서짐
- **조선통신사의 역할**: 전쟁 이후 일본과의 관계 회복을 위해 파견 됨. 유학자, 의사, 화가 등이 건너가 선진 문물을 전해주기도 하고 일본의 정세를 보고 돌아와 왕과 조정에 보고하는 정보원의 역할을 하기도 함

## ② 청의 침략에 맞서 싸우다

### (1) 광해군의 정치와 인조반정
| 구분 | 내용 |
|---|---|
| 왜란 후 광해군의 복구 정책 | 토지 대장, 호적 정비 → 국가 재정 수입 증대<br>성곽과 무기 수리 → 국방력 강화 |
| **중립외교** | 누르하치가 (① **후금**) 건설 → 후금이 명을 공격하자 명이 조선에 군사 지원 요청<br>광해군은 (② **강홍립**)을 파견하며 적절히 대응하도록 지시<br>→ 명이 후금에 패하자 강홍립이 후금에 투항<br>→ 의리와 명분을 중시한 서인의 반발 |
| **인조반정 (1623)** | 광해군이 의붓형제인 영창 대군을 죽이고 양어머니인 인목대비 폐위<br>→ 서인들은 이를 구실로 정변을 일으켜 인조를 왕으로 내세움 |

### (2) 정묘호란과 병자호란
| 구분 | 내용 |
|---|---|
| **정묘호란 (1627)** | 인조와 서인 정권은 후금을 배척하고 명을 가까이하는 정책을 펼침(**친명배금 정책**) → 후금의 침략<br>인조는 강화도로 피신, 조선군과 의병들이 후금에 맞서 싸움<br>후금과 (③ **형제 관계**) 체결 후 돌아감 |
| **병자호란 (1636)** | 세력이 강해진 후금은 더 많은 물자를 요구하며 **군신관계**를 체결할 것 요구<br>주화론(손글씨: 항복)과 척화론(손글씨: 버티기)의 대립<br>→ 외교적으로 해결하자는 주화론과 맞서 싸우자는 척화론의 대립<br>후금은 나라 이름을 청으로 바꾸고 조선 재공격<br>청 군이 빠르게 진격해와서 인조와 신하들은 (④ **남한산성**)으로 피신 |

### (3) 청과의 화의와 북벌 운동
| 구분 | 내용 |
|---|---|
| (⑤ **삼전도**)의 굴욕 | 남한산성에서 한달 넘게 버텼으나 결국 항복<br>→ 인조는 산성에서 나와 삼전도로 가서 청 태종에게 삼배구고두(세번 절하고 아홉 번 머리를 찧음)하며 항복<br>두 왕자(소현세자, 봉림대군)들과 신하, 백성들이 청에 끌려가 고통을 겪음. 많은 공물도 바쳐야 했음 |
| 북벌 운동 | 청에 대한 반감이 커지면서 치욕을 씻어야 한다는 (⑥ **북벌론**)이 등장<br>청에서 돌아와 왕이 된 효종(봉림대군)은 성곽과 무기를 정비하고 군대를 키움 → 효종 사망 이후 북벌 정책 중단<br>북학론의 등장: 청과의 교류가 늘면서 청의 발달된 문물을 받아들이자는 움직임이 나타남<br>(손글씨 메모) **청나라 파견: 연행사** |

## MEMO
- **이괄의 난**: 인조반정의 공신이였던 이괄이 적절한 대우를 받지 못한 것에 불만을 품고 반란을 일으킴. 후금으로 도망친 이괄 일파는 인조가 부당하게 즉위했다고 호소했고 후금은 이를 구실로 정묘호란을 일으킴
- **환향녀와 비극적 삶**: 병자호란때 끌려간 백성들중 대다수는 여성이었음. 이들은 가문에서 몸값을 지불하거나 목숨을 걸고 탈출하여 고향으로 돌아왔으나 목숨보다 절개를 중시하던 조선에서는 이들에게 이혼을 요구하거나 가정에서 버림 받음
- **하멜표류기**: 효종이 북벌을 추진하던 시기 제주도에 하멜 일행이 표류하게 됨. 이에 효종은 하멜보다 먼저 조선에 정착해 무기 개발을 담당하고 있던 박연을 보내 하멜 일행을 설득. 이후 조선식 이름과 관직을 주고 왕의 호위 임무를 맡기기도 함

## ① 나라의 기틀을 다지다

### 태조 (① **왕건**) (918~943)

#### 건국 및 후삼국 통일
- **고려 건국(918년)**: 고구려 계승 → 국호 고려 / 연호(천수) 사용
  - → **송악(개경)** 천도(919년)
- **통일 정책**: 호족·선종 승려 포섭 + 신라와 화친 + 후백제와 대립
  - ⇒ 발해 세자 대광현 및 수만 명의 유민들이 고려에 망명(926년?)
  - \\+ 후백제 내부 지배층 분열 → 견훤의 투항(935년)
  - \\+ 신라 경순왕의 통합 요청(935년)
  - ⇒ 후백제 격파 → **후삼국 통일(936년)**
- **의의**: 외세의 도움 없이 **자주적**으로 민족 재통합 이룩
  - → 새로운 민족 문화 발전의 토대 마련

#### 정책
| 구분 | 내용 |
|---|---|
| **민생 안정** | 세율을 1/10로 정하여 조세 부담 감소 / 빈민 구제를 위해 흑창 설치 |
| **호족 포섭 및 견제** | 포섭책: **혼인** 정책, **사성(賜姓)** 정책, 토지·관직 하사<br>★ 견제책: **사심관** 제도, **기인** 제도 |

|---|---|

### 정종 (945~949)
- **왕규의 난(945년)**: 혜종(943~945) 대신 자신의 외손자를 왕위에 세우고자 함
  - → 서경의 왕식렴이 진압, 혜종의 이복동생인 왕요(정종) 추대

### 광종 (949~975)
- ★ (② **노비안검법**) 실시: 호족의 경제력 및 군사력 약화 + 양인 수 증가(→ 국가 재정 기반 확대)
- (③ **과거제**) 실시(쌍기 건의): 유교적 지식과 능력을 지닌 인재 선발

- (손글씨 메모) **공신과 호족 숙청**
- **칭제건원(稱帝建元)**: **황제** 호칭, **연호**(광덕, 준풍 등) 사용

### 성종 (981~997)
- **유교** 정치 이념 확립 노력 (← **최승로**의 (④ **시무 28조**) 수용)
  - 제7조: **지방관**(12목) 파견 → 중앙 집권 체제 강화

|---|---|
| 교육 기관 | 태조: 개경과 서경에 학교 설치<br>성종: 국자감(개경), 향교(지방) 설치 |
| **과거제** | 종류: **제술과·명경과**(문관 선발), **잡과**(기술관 선발), **승과**(승려에게 승계 부여 / 교종선, 선종선)<br>응시자격: 법적으로는 **양인** 이상 가능<br>특징: **무과**는 거의 시행하지 않음(무예가 뛰어난 사람을 무관으로 임명) |
| **음서** | 왕족과 공신의 후손, 5품 이상 고위 관리 자손에게 시험 없이 관직 부여<br>→ 고위 관료로 승진 가능, 관료의 지위 세습 가능<br>⇒ **귀족** 사회 유지 수단으로 기능 |
| 토지 제도 | (② **전시과**): 모든 관리에게 수조권이 설정된 토지를 줌 → 관리 사망 시 국가에 **반납**<br>**공음전**: 5품 이상의 관리에게 주는 세습 가능한 토지 |

## MEMO
- **재신과 낭사**: 중서문하성의 재신은 2품 이상의 고위 관리로 국가 중요 정책을 의논하고 결정하였으며, 낭사는 3품 이하의 관리로 언론 부문을 담당함
- **추밀(추신)과 승선**: 중추원의 추밀은 군사 기무를, 승선은 왕명 출납을 담당함
- **대간의 권한**: 중서문하성의 낭사와 어사대의 관원은 대간으로 불렸음. 대간은 왕의 잘못을 논하는 간쟁, 잘못된 왕명을 시행하지 않고 되돌려 보내는 봉박, 관리 임명과 법령 개폐에 동의하는 서경 등의 권리를 행사함
- **고려의 3경**: 개경, 서경, 동경(경주)이었다가 후기에 동경은 남경(서울)로 변화함
- **호족과 향리**: 고려 시대에 각 지역에 지방관(수령)이 파견되면서, 호족들은 점차 수령을 보좌하고 행정 실무를 맡는 향리로 변화해 감. 그러나 모든 군현에 수령을 파견하지는 못하였으며, 주현보다 속현이 더 많았음
- **고려의 학교**: 고려는 유학 교육을 중시하여 개경에 국자감을 설치하고, 주마다 향교를 설립함. 국자감의 유학 교육을 담당한 국자학, 태학, 사문학에는 각각 3품, 5품, 7품 이상 관리의 자제가 입학하였고, 기술 교육을 담당한 율서산학에는 양민 이상의 자제면 입학할 수 있었음
- **음서제의 혜택**: 성종 때 공신 이외에 5품 이상 관리 전체를 대상으로 확대됨. 고위 관리의 경우 아들, 손자 이외에 사위, 조카, 외손자까지 혜택을 받음
`,hh=`# Ⅲ. 고려의 성립과 변천 — 1. 고려의 건국과 정치 변화 (p.82~85)

> 원본: \`KakaoTalk_20261107_114152237_02.jpg\` (학습지 3쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ③ 정치 질서가 동요하고 무신 정권이 성립하다

### (1) 이자겸의 난
| 구분 | 내용 |
|---|---|
| 배경 | 문벌의 보수화 + **경원 이씨**와 왕실의 거듭된 혼인 관계<br>※ 문벌(귀족): 지방 호족과 신라 6두품 출신의 유학자(=문신(文臣))<br>→ 중앙 정계 진출, 여러 세대에 걸쳐 고위 관리 배출<br>⇒ 과거와 음서로 주요 관직 독점 + 왕실 및 문벌과 **혼인**<br>(대표 문벌 귀족: 경원 이씨(이자겸), 파평 윤씨(윤관), 해주 최씨(최충), 경주 김씨(김부식) 등) |
| 과정 | (① **이자겸**)의 권력 독점<br>→ 인종과 측근 세력의 이자겸 제거 시도<br>→ 이자겸과 척준경의 반격(이자겸의 난, 1126년), 이자겸의 권력 장악, 금(여진)의 사대 요구 수용<br>→ 인종이 척준경을 통해 이자겸 제거, 탄핵으로 척준경 축출, But 왕실 권위 떨어짐 |

### (2) 묘청의 서경 천도 운동
| 구분 | 내용 |
|---|---|
| 배경 | 인종의 개혁 추진(왕권 회복 및 민생 안정·국방력 강화 목적)<br>→ 개혁적 문벌과 서경 출신 관료(정지상 등)들이 보수적 문벌을 견제하고 (② **묘청**)을 천거하여 개혁 추진<br>**서경 세력**(정지상, 묘청 등): **칭제 건원**, **서경** 천도(풍수지리설), **금** 정벌 주장 |
| 과정 | 인종이 묘청의 주장에 동조하여 서경에 대화궁 축조 및 팔성당 설치<br>→ 김부식 등 개경 세력의 반대<br>→ 묘청 등이 서경에서 반란을 일으킴(국호 대위, 연호 천개 / 1135년)<br>→ **김부식** 등이 관군을 이용하여 반란 진압 |

### (3) 무신 정변의 발생
| 구분 | 내용 |
|---|---|
| 배경 | 이자겸의 난 및 묘청의 서경 천도 운동 이후 정치 질서 동요 및 **왕권 약화**<br>의종의 실정: 개혁 정치의 좌절로 사치와 향락에 빠짐<br>문벌의 권력 독점과 부패 → **문신** 우대 + **무신**에 대한 차별 대우<br>⇒ 하급 군인의 불만 고조(군인전 미지급, 공사 동원 등) |
| 전개 | 정중부, 이의방 등이 보현원 연회를 계기로 정변을 일으킴<br>→ 문신 제거, 의종 폐위 ⇒ **무신 정권의 성립(1170년~1270년)** |
| 무신 정권 — 초기 | 이의방·정중부 등 정권 장악: (③ **중방**)을 통해 권력 행사<br>무신 간의 권력 다툼으로 국정 및 사회적 혼란 → 농민·천민의 봉기 빈번 |
| 무신 정권 — **최씨 정권** | **최충헌의 집권**<br>- (④ **교정도감**) 설치: 정책 결정, 반대 세력 감시<br>- **도방** 확대: 호위 강화, 농민 봉기 탄압<br>**최우의 집권**<br>- **정방** 설치: 인사 행정 담당<br>- **서방** 설치: 능력 있는 문인들에게 정책 자문 → 문신 등용<br>- **야별초** 조직: 군사적 기반 |

### (4) 농민과 천민의 봉기
| 구분 | 내용 |
|---|---|
| 배경 | 무신들의 권력 다툼으로 인한 정치 혼란 및 신분 질서 동요<br>**무신**들의 백성 수탈 심화(농장 확대, 세금 과다 수취 등)<br>**신분 상승**에 대한 기대감 고조(이의민 등) |
| 과정 | **망이·망소이의 난**(1176년, 공주 명학소): 과도한 세금 부담 반발<br>**김사미와 효심의 난**(1193년, 운문과 초전): 연합 전선(농민+경주) 형성<br>**전주 관노의 난**(1182년, 전주): 지방관 횡포에 불만<br>**만적의 난**(1198년, 개경, 최충헌의 사노비): **신분 해방** 시도 → 실패<br>삼국 부흥 운동: 신라 부흥 운동(경주), 고구려 부흥 운동(서경) 등 |
| 의의 | **불평등**에 대한 항거, **하층민**의 의식 성장 |

## MEMO
- **이자겸의 권력 장악**: 이자연(祖父)-이호(父)-이자겸으로 이어지는 3대 동안 경원 이씨 가문은 왕실과의 혼인을 통해 10명의 왕비를 배출하여 권력을 장악함. 특히 이자겸은 자신의 둘째 딸을 예종과, 셋째, 넷째 딸을 인종(이자겸의 외손자)과 혼인시킴으로써 당대 최고의 권력을 누렸다가 사돈인 척준경에 의해 제거됨

- **서경 세력 VS 개경 세력**

| 서경 세력 | 개경 세력 |
|---|---|
| 묘청, 정지상 | 김부식 |
| 풍수지리설 | 유교 사상(사대적) |
| 서경 천도 주장 | 서경 천도 반대 |
| 금 정벌 주장 | 금 사대 주장 |
| 고구려 계승 의식 | 신라 계승 의식 |
| 자주성 강조 | 중국 중심의 국제 질서 인정 |

- **문신과 무신의 차별**: 고려 시대 무신은 정3품인 상장군까지만 승진할 수 있었으며, 2품 이상 고위 관직에는 문신이 임명되었음. 심지어 군대의 총사령관도 문신이 맡음
- **무신 정권**: 초기 무신 정권은 일명 하극상의 시대로서, 이의방(1170~1174)에 이어 같이 무신 정변을 일으킨 정중부(1174~1179)가 권력을 탈취하고, 그의 부하였던 경대승(1179~1183)이 다시 권력을 장악함. 경대승이 죽자 그의 부하인 이의민(1183~1196)이 권력을 차지함. 천민 출신이었던 이의민이 최충헌에 의해 제거된 후 1196년부터 1258년까지 최충헌 - 최우 - 최항 - 최의로 이어지는 4대 60여 년간의 최씨 정권이 성립되어 사회가 다소 안정됨. 몽골 침입 시 주화(主和)파에 의해 최의가 제거되면서 무신 정권도 몰락함
`,mh=`# Ⅲ. 고려의 성립과 변천 — 2. 고려의 대외 관계 (p.86~91)

> 원본: \`KakaoTalk_20261107_114152237_03.jpg\` (학습지 4쪽)
> 손글씨로 채운 빈칸 답은 **굵게** 표시함

## ① 거란과 여진의 침입을 막아 내다

### (1) 거란의 침입과 격퇴
※ 10세기 초 동아시아의 정세(당 멸망 후)
- 거란의 요(遼) 건국(916년) → 한(漢)족의 송(宋) 건국(960년), 요와 송의 대립
- → 고려는 거란(요) 견제(북진 정책) + 송과 우호적 관계(송: 거란 견제)

| 구분 | 내용 |
|---|---|
| 1차 침입 (993년) | 배경: 고려의 친송 정책 + 북진 정책<br>경과: 거란(소손녕)의 고려 침략(993년) → (① **서희**)의 외교 담판으로 **강동 6주** 확보 |
| 2차 침입 (1010년) | 배경: 강조의 정변을 구실로 침략<br>경과: 개경 함락 → 강화 후 물러남 |
| 3차 침입 (1019년) | 배경: 거란의 요구(고려 국왕 방문, 강동 6주 반환)를 고려가 거절<br>경과: 개경 부근까지 침략 → **강감찬**의 (② **귀주대첩**)으로 격퇴<br>결과: 개경에 **나성**, 국경 일대에 **천리 장성** 축조로 침략 대비, 고려·요·송의 세력 균형 유지 |

### (2) 여진 정벌과 동북 9성의 축조
| 구분 | 내용 |
|---|---|
| 여진 정벌 | **초기 고려-여진 관계**: 부족 단위 생활, 토산물을 바치며 고려에 복속 요청 → 고려를 부모의 나라로 섬김, 고려는 회유 정책 실시<br>**고려의 여진 정벌**: 12세기 완옌부를 중심으로 강성해져 고려 동북쪽 국경 지대 침략<br>→ (③ **윤관**)의 건의로 **별무반** 편성, 정벌 후 **동북 9성** 축조(1107년)<br>→ 여진 요구(조공 약속), 방어 곤란으로 9성 반환(1109년) |
| 여진의 침략 | **여진의 성장**: 여진의 금(金) 건국(1115년) → 황제를 칭하며 고려에 형제 관계 요구 → 고려 조정의 반대 여론<br>**경과**: 금의 요 멸망(1125년) + 송 공격(1127년, 북송→남송 축소) → 고려에 **사대 관계** 요구 → **이자겸** 등 집권 세력이 전쟁 회피와 정권 유지 위해 수용<br>**결과**: 고려의 북진 정책 중단 + 자주성 손상 |

## ② 주변 국가와 활발하게 교류하다

**국제 무역항: (④ 벽란도)**

| 나라 | 내용 |
|---|---|
| **송** | 가장 **활발** → 문화적·경제적 실리 추구<br>송의 제도를 참고하여 제도 정비, 선진 문물 수용 → **초조대장경** 간행, **청자** 제작, 음악 발달 등<br>(송: 거란, 여진 등 주변 민족 견제)<br>수입: 왕실과 귀족의 수요품(비단, 서적, 약재 등)<br>수출: 나전 칠기, 화문석, 종이, 인삼 등 |
| **거란** | 거란 침입 격퇴 후 정기적 사신 파견<br>수입: 은, 모피 등 / 수출: 농기구, 곡식 등<br>**대장경**: 고려의 대장경 편찬에 도움 |
| 여진 | 수입: 말, 화살 등 / 수출: 식량, 농기구 등 |
| 일본 | 수입: 수은, 향료 등 / 수출: 식량, 인삼, 책 등 |
| **아라비아** | 수입: 수은, 향료, 산호 등 / 수출: 금, 비단 등<br>→ **코리아**의 이름이 서방 세계에 알려짐 |

## 확인 문제
1. 다음 설명이 맞으면 ○표, 틀리면 ×표를 하거나, 빈칸에 들어갈 알맞은 말을 쓰시오.
   1. 고려는 건국 초부터 북진 정책을 추진하여 거란을 견제하였다. ( **○** )
   2. 고려는 여진의 침입을 물리친 뒤 개경에 나성을 쌓고 국경 지역에 천리장성을 쌓았다. ( **×** ) — 여진이 아니라 **거란**
   3. ( **송** )의 선진 문물은 고려의 청자 제작, 음악 발달 등에 영향을 주었다.
   4. ( **여진** )은/는 고려에 말과 화살 등을 바치고, 식량과 농기구 등 생활필수품을 받아 갔다.
   5. 아라비아 상인이 고려에 찾아와 교류하면서 고려가 ( **코리아** )(이)라는 이름으로 서방 세계에 알려졌다.

2. 다음에서 설명하는 곳으로 옳은 것은? ( **②** )
   > 고려 시대의 국제 무역항으로, 예성강 입구에 있었다. 송과 일본, 아라비아 상인까지 와서 교류하였다.

## MEMO
- **서희의 외교 담판**: 서희는 거란의 침략 의도가 송과의 외교 관계 단절에 있다고 파악하고, 고려가 송과의 교류를 단절하고 거란과 교류할 것을 약속하는 대신 압록강 동쪽의 강동 6주를 획득함. 이 때 서희는 고려가 고구려의 계승국이고, 여진이 가로막고 있어 거란과 국교를 맺기 힘들다는 논리를 내세움

## ① 몽골의 침략을 극복하다

| 구분 | 내용 |
|---|---|

| 몽골의 침략 — 배경 | 몽골의 거란족 토벌에 대한 무리한 공물 요구<br>몽골 사신 저고여의 피살(1225년) |

## ② 원의 내정 간섭에 맞서 개혁 정치를 펴다

### (1) 원의 내정 간섭
- **영토 축소**: (③ **쌍성총관부**)(화주), 동녕부(서경), 탐라총관부(제주)를 설치하고 직접 지배
- **내정 간섭**: **정동행성**(일본 원정 실패 이후 유지)을 통한 내정 간섭
  - 원의 **부마국**화 → 고려의 왕실 호칭과 관제 **격하**
- **경제적 수탈**: 일본 원정에 필요한 군대와 물자 강요, 조공 명목으로 물품과 인력 수탈(금·인삼·매 등, **공녀**와 환관)
- **문화적 교류**: 고려에서 **몽골풍** 유행, 원에 **고려양** 전래

### (2) 권문세족의 성장과 공민왕의 개혁 정치
- (④ **권문세족**)(친원파)의 성장: 원나라에 기대어 권력을 누리는 원 간섭기의 새로운 지배계급
  - 고위 관직 독점 및 권력 세습(음서), 막대한 **농장**과 노비 소유 → 국가 재정 궁핍
- **공민왕의 개혁 정치**

| 구분 | 내용 |
|---|---|
| 배경 | 원·명 교체기를 이용하여 개혁 추진 |
| 내용 — 자주성 회복 | 친원 세력 제거: 기철 일파 숙청<br>정동행성(이문소) 폐지<br>쌍성총관부 공격 → 철령 이북의 땅 점령<br>왕실 호칭 및 제도 복구, 몽골풍 금지 |
| 내용 — 내정 개혁(=왕권 강화) | 신돈 등용 → (⑤ **전민변정도감**) 설치<br>(권문세족이 빼앗은 토지와 노비를 본래 주인에게 돌려주고 강제로 노비가 된 사람들을 해방시킴)<br>성균관 정비, 유학교육 강화 → **신진 사대부** 성장 |
| 결과 | 홍건적·왜구의 침입 + **권문세족**의 반발 → 신돈 제거, 공민왕 시해로 실패 |

## ③ 새로운 정치 세력이 성장하고 고려가 멸망하다

| 구분 | 내용 |
|---|---|
| 새로운 세력의 성장 — (⑥ **신진 사대부**) | 원 간섭기 등장(대부분 하급 관리나 지방 향리의 자제)<br>→ 성리학 공부, 과거 급제로 관직 진출 ⇒ 공민왕 시기 성장<br>권문세족의 비리 비판, 개혁 주장 |
| 새로운 세력의 성장 — **신흥 무인 세력** | **홍건적**과 **왜구**의 격퇴 과정에서 성장<br>대표 세력: **최영, 이성계** 등 |
| 고려의 멸망 | 원 혼란기에 주원장이 명(明) 건국(1368년), 명이 철령 이북의 영토 요구(1388년)<br>→ 우왕과 최영의 요동 정벌 추진<br>→ **위화도 회군**: 요동 정벌을 반대한 이성계가 회군, 개경 장악, 최영 제거, 우왕·창왕 폐위 후 공양왕 옹립<br>→ 신진 사대부의 분열: **온건파**(고려 유지-정몽주) VS **급진파**(왕조 교체-정도전)<br>→ 이성계와 **급진파** 사대부의 연계: 개혁 추진, 권문세족 약화, 정몽주 등 제거<br>→ 공양왕이 이성계에게 왕위 넘김, **조선 건국**(1392년) |

## MEMO
- **삼별초의 항쟁**: 도방과 함께 최씨 정권의 군사적 기반이었던 삼별초는 야별초에서 분리된 좌별초와 우별초, 신의군(몽골 포로 탈출)을 일컬음. 고려의 개경 환도 후 지도자인 배중손을 중심으로 항전을 결정하고, 강화도에서 진도로, 진도에서 제주도로 이동하여 몽골 항전을 지속하였음
- **몽골 제국의 금·남송 정복**: 몽골 제국이 금의 수도를 함락(1233년)시키자, 남송은 몽골 제국과 연합하여 금을 멸망시킴(1234년). 이후 남송의 조약 위반으로 몽골이 남송을 멸망시킴(1279년). 그 과정에서 몽골 제국의 5대 대칸인 쿠빌라이가 몽골 제국의 국호를 '대원(大元)'으로 변경함(1271년)
- **고려의 관제 및 호칭 격하**: 원 간섭기에 고려의 관제는 2성에서 첨의부로, 6부에서 4사로, 중추원에서 밀직사로 격하되었으며, 호칭 또한 조·종은 왕(왕의 명칭도 충~으로 불림), 짐(朕)은 고, 폐하는 전하, 태자는 세자로 격하됨
- **정동행성**: 원이 일본 정벌을 위해 고려에 설치(1280년)한 기관. 일본 정벌이 실패하였음에도 공민왕 때까지도 지속되어 내정간섭의 도구로 활용됨
- **도평의사사**: 고려 후기의 최고 행정 기구로, 무신 정변 이후 도병마사의 기능이 확대되면서 명칭이 바뀜
- **홍건적의 난**: 원 말기에 일어난 한족의 반란으로, 원나라에 쫓겨 1359년과 1360년에 고려를 침공하여 개경 함락, 공민왕 암살 등의 위기가 있었음

| 왕 | 내용 |
|---|---|

## ② 유교 이념에 따라 통치 체제를 정비하다

### (1) 중앙정치기구

| 구분 | 내용 |

| 형성 | 조선의 건국에 참여하지 않고 지방에서 학문연구와 교육에 힘쓴 사대부<br>→ 정몽주, 길재 등 온건파 사대부들의 학풍을 계승<br>→ 왕도 정치와 향촌자치를 주장 |

### (3) 훈구와 사림의 갈등
**사화**: 사림이 큰 피해를 입은 사건

| 사화 | 내용 |
|---|---|
| **무오사화 (1498)** | 배경: 김종직의 조의제문<br>→ 훈구 세력이 김종직이 단종을 몰아낸 세조를 의제를 몰아낸 항우에 빗대어 비판했다고 주장<br>연산군과 훈구세력이 손 잡고 사림을 제거 |
| **갑자사화 (1504)** | 배경: 연산군의 어머니(폐비 윤씨) 사건과 관련된 사림들이 제거 됨<br>→ 훈구와 사림 세력이 모두 피해<br>이후 중종반정으로 중종이 즉위. 연산군은 왕위에서 쫓겨남<br>훈구의 힘이 세지자 중종은 (③ **조광조**)를 비롯한 사림 세력을 등용함 |
| **기묘사화 (1519)** | 배경: 조광조의 급진적인 개혁<br>→ **소격서 폐지**: 왕실의 도교 행사를 주관하던 관청 폐지<br>→ (④ **현량과**) 실시: 학문이 뛰어난 인재를 추천하여 등용. 과거 시험 없이 사림들이 대거 정계에 진출 가능<br>→ 공신의 위훈 삭제 주장: 중종이 왕위에 오를 때 부당하게 왕위에 오른 사람들의 자격을 박탈해야함을 주장<br>급진적인 개혁 정책에 부담을 느낀 중종과 훈구 세력이 조광조와 사림 세력을 제거 |
| **을사사화 (1545)** | 배경: 명종 시기 외척들 간의 권력 다툼<br>→ 중종 이후 차례대로 왕위에 오른 인종과 명종의 외삼촌(대윤 vs 소윤)이 다툼을 벌이다가 소윤이 승리. 대윤과 거기에 포함된 사림들이 많이 피해를 봄 |

> (손글씨 암기법) **무**오 → **갑**자 → **기**묘 → **을**사 : "(무) **갑**자기 **기**묘한 **을사**사화가 일어났다"

| 구분 | 내용 |
|---|---|
| 16c 중반 이후 동아시아 정세 변화 — 명 | 환관과 외척들의 횡포가 심해짐<br>몽골과 왜구의 침입 → 사회적 불안 심화 |
| 〃 — 조선 | 붕당간의 대립이 심화되는 등 정치적 혼란<br>군역 제도가 문란해지면서 국방력 약화 |
| 〃 — 일본 | 도요토미 히데요시의 전국 시대 통일 → 대륙 진출을 위해 전쟁 준비 |
| 배경 | 일본은 '명을 정벌하러 가는데 길을 빌려 달라'(손글씨: **정명가도**)라는 구실로 조선을 침략(1592.4) |
| 전개 | 부산진, 동래성 함락, 신립의 충주 방어선도 무너짐<br>선조는 광해군을 세자로 책봉하고 의주까지 피란을 감. 명에 지원 요청<br>일본군은 20여일 만에 한성 점령, 평양을 거쳐 함경도 지역까지 올라옴 |

### (2) 의병과 수군의 활약
| 구분 | 내용 |
|---|---|
| 의병의 활약 | (① **곽재우**) 등 유생들이 농민을 모아 의병을 일으킴<br>→ 익숙한 지리를 활용한 전술로 일본군의 보급로를 차단하며 큰 활약<br>유정과 휴정 등 승려들도 승군을 조직하여 대항 |
| 수군의 활약 | 이순신이 이끈 수군이 옥포, 사천, 당포에서 승리<br>(② **한산도 대첩**)의 승리: 서남해의 제해권을 장악<br>→ 곡창 지대인 충청도와 전라도 지방을 지키고 일본군의 해상 보급로 차단 |

- 명은 일본의 대륙 진출을 막기 위해 조선에 지원군을 보냄 → 조선-명 연합군이 평양성 전투에서 승리
- 이후 김시민은 진주성에서, 권율은 행주산성에서 큰 승리를 거둠

### (3) 정유재란
| 구분 | 내용 |
|---|---|
| 발발 | 일본군은 명과 휴전 협상 전개 → 3년에 걸친 휴전 협상이 결렬되면서 정유재란(1597) 발발 |
| 전개 | 휴전 기간 동안 조선은 군제를 개편하고 무기와 성곽을 보강해서 일본의 침략을 효과적으로 막아냄<br>→ 훈련도감 설치, 화포 개량과 조총 제작 등<br>이순신의 명량해전 승리<br>도요토미 히데요시의 사망으로 일본군이 조선에서 철수 |
| 결과 | 이순신이 퇴각하는 일본군을 (③ **노량해전**)에서 무찌르면서 전쟁 종료 |

### (4) 왜란의 영향
| 구분 | 내용 |
|---|---|
| 조선 | 토지 황폐화, 백성의 생활과 국가 재정 어려움<br>많은 사람이 죽고 일본에 끌려가기도 함 → 귀무덤, 코무덤 등<br>궁궐, 사고 등이 불타없어졌고 문화재는 약탈 당함 |
| 일본 | 포로로 끌고간 성리학자, 활자 인쇄공, 도자기 기술자 등을 통해 문화 발전의 계기 마련 → 도공 이삼평이 아리타 도자기 형성에 크게 기여함<br>도쿠가와 이에야스가 에도막부를 열고 조선과 국교 관계 정상화 요청 → 국교 회복을 위해 조선은 (④ **조선 통신사**)를 파견 |
| 명 | 전쟁의 영향으로 국력 약화 → 만주에서 여진족 성장 |

## MEMO
- **난중일기**: 이순신이 왜란 동안 쓴 일기로 전쟁 상황이 상세히 기록되어 있어, 귀중한 자료로 평가 됨. 2013년 유네스코 세계 기록 유산으로 등재되어 있음
- **판옥선의 장점**: 바닥이 평평한 조선의 판옥선은 배의 회전이 쉬워 다양한 전술을 펼칠 수 있었음. 또한 일본의 전선에 비해 튼튼해서 화포를 쏠 때의 충격에 잘 견딤. 판옥선에 지붕을 덮어 거북선을 만들었고 이는 돌격선의 역할을 함. 반면 일본의 전선은 가벼워서 속도는 빨랐지만 포 공격에 쉽게 부서짐
- **조선통신사의 역할**: 전쟁 이후 일본과의 관계 회복을 위해 파견 됨. 유학자, 의사, 화가 등이 건너가 선진 문물을 전해주기도 하고 일본의 정세를 보고 돌아와 왕과 조정에 보고하는 정보원의 역할을 하기도 함

## ② 청의 침략에 맞서 싸우다

### (1) 광해군의 정치와 인조반정
| 구분 | 내용 |
|---|---|
| 왜란 후 광해군의 복구 정책 | 토지 대장, 호적 정비 → 국가 재정 수입 증대<br>성곽과 무기 수리 → 국방력 강화 |
| **중립외교** | 누르하치가 (① **후금**) 건설 → 후금이 명을 공격하자 명이 조선에 군사 지원 요청<br>광해군은 (② **강홍립**)을 파견하며 적절히 대응하도록 지시<br>→ 명이 후금에 패하자 강홍립이 후금에 투항<br>→ 의리와 명분을 중시한 서인의 반발 |
| **인조반정 (1623)** | 광해군이 의붓형제인 영창 대군을 죽이고 양어머니인 인목대비 폐위<br>→ 서인들은 이를 구실로 정변을 일으켜 인조를 왕으로 내세움 |

### (2) 정묘호란과 병자호란
| 구분 | 내용 |
|---|---|
| **정묘호란 (1627)** | 인조와 서인 정권은 후금을 배척하고 명을 가까이하는 정책을 펼침(**친명배금 정책**) → 후금의 침략<br>인조는 강화도로 피신, 조선군과 의병들이 후금에 맞서 싸움<br>후금과 (③ **형제 관계**) 체결 후 돌아감 |
| **병자호란 (1636)** | 세력이 강해진 후금은 더 많은 물자를 요구하며 **군신관계**를 체결할 것 요구<br>주화론(손글씨: 항복)과 척화론(손글씨: 버티기)의 대립<br>→ 외교적으로 해결하자는 주화론과 맞서 싸우자는 척화론의 대립<br>후금은 나라 이름을 청으로 바꾸고 조선 재공격<br>청 군이 빠르게 진격해와서 인조와 신하들은 (④ **남한산성**)으로 피신 |

### (3) 청과의 화의와 북벌 운동
| 구분 | 내용 |
|---|---|
| (⑤ **삼전도**)의 굴욕 | 남한산성에서 한달 넘게 버텼으나 결국 항복<br>→ 인조는 산성에서 나와 삼전도로 가서 청 태종에게 삼배구고두(세번 절하고 아홉 번 머리를 찧음)하며 항복<br>두 왕자(소현세자, 봉림대군)들과 신하, 백성들이 청에 끌려가 고통을 겪음. 많은 공물도 바쳐야 했음 |
| 북벌 운동 | 청에 대한 반감이 커지면서 치욕을 씻어야 한다는 (⑥ **북벌론**)이 등장<br>청에서 돌아와 왕이 된 효종(봉림대군)은 성곽과 무기를 정비하고 군대를 키움 → 효종 사망 이후 북벌 정책 중단<br>북학론의 등장: 청과의 교류가 늘면서 청의 발달된 문물을 받아들이자는 움직임이 나타남<br>(손글씨 메모) **청나라 파견: 연행사** |

 * 차근차근 역사 — 학습 기록을 "이 구글 스프레드시트"에 표(DB 형식)로 저장하는 Apps Script
 *
 * 시트 하나 = 표 하나, 1행 = 열 이름, 2행부터 = 기록
 *   meta · cards · nodes · days · achievements · sessions  (앱이 다시 읽음)
 *   topics · wrong_notes                                     (보기용 요약)
 *
 * 설치 (처음 한 번)
 *  1. 구글 스프레드시트를 새로 만든다 (https://sheets.new)
 *  2. 메뉴 [확장 프로그램] > [Apps Script] → 원래 있던 코드를 지우고 이 코드를 붙여넣기 → 저장
 *  3. [배포] > [새 배포] > 톱니바퀴에서 [웹 앱]
 *     - 실행 계정: 나 / 액세스 권한이 있는 사용자: 모든 사용자
 *  4. [배포] → 권한 승인 → "웹 앱 URL"을 앱의 [내 기록 > 기록 저장]에 붙여넣기
 *
 * KEY는 앱이 만들어 준 비밀 열쇠. 열쇠가 맞는 요청만 읽고 쓸 수 있다.
 */
const KEY = '__KEY__';
const READ_TABLES = ['meta', 'cards', 'nodes', 'days', 'achievements', 'sessions'];

function doGet(e) {
  if (!e || !e.parameter || e.parameter.key !== KEY) return json_({ ok: false, error: 'key' });
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const tz = ss.getSpreadsheetTimeZone();
  const tables = {};
  READ_TABLES.forEach(function (name) {
    const sh = ss.getSheetByName(name);
    if (!sh || sh.getLastRow() < 1) return;
    const values = sh.getRange(1, 1, sh.getLastRow(), Math.max(1, sh.getLastColumn())).getValues();
    // 시트가 날짜로 바꿔 버린 칸은 글자(yyyy-MM-dd)로 되돌림
    const fixed = values.map(function (row) {
      return row.map(function (v) {
        return v instanceof Date ? Utilities.formatDate(v, tz, 'yyyy-MM-dd') : v;
      });
    });
    tables[name] = { header: fixed[0], rows: fixed.slice(1) };
  });
  return json_({ ok: true, tables: tables });
}

function doPost(e) {
  let body;
  try {
    body = JSON.parse(e.postData.contents);
  } catch (err) {
    return json_({ ok: false, error: 'body' });
  }
  if (body.key !== KEY) return json_({ ok: false, error: 'key' });
  const lock = LockService.getDocumentLock();
  lock.waitLock(15000);
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    Object.keys(body.tables).forEach(function (name) {
      writeTable_(ss, name, body.tables[name]);
    });
    // 처음 만들 때 생기는 빈 "시트1"은 정리
    const first = ss.getSheets()[0];
    if (ss.getSheets().length > 1 && first.getLastRow() === 0 && Object.keys(body.tables).indexOf(first.getName()) < 0) {
      ss.deleteSheet(first);
    }
  } finally {
    lock.releaseLock();
  }
  return json_({ ok: true, savedAt: new Date().toISOString() });
}

/** 표 하나를 통째로 다시 쓴다 (1행 열 이름 + 기록) */
function writeTable_(ss, name, t) {
  const sh = ss.getSheetByName(name) || ss.insertSheet(name);
  const width = t.header.length;
  const data = [t.header].concat(
    t.rows.map(function (r) {
      const row = r.slice(0, width);
      while (row.length < width) row.push('');
      return row;
    }),
  );
  sh.clearContents();
  // 날짜처럼 보이는 글자가 날짜로 바뀌지 않도록 지정한 열은 '일반 텍스트'
  (t.textCols || []).forEach(function (col) {
    const i = t.header.indexOf(col);
    if (i >= 0) sh.getRange(1, i + 1, Math.max(data.length, 2), 1).setNumberFormat('@');
  });
  sh.getRange(1, 1, data.length, width).setValues(data);
  sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#ece9ff');
  sh.setFrozenRows(1);
  // 남은 옛 행 정리
  const extra = sh.getMaxRows() - Math.max(data.length, 2);
  if (extra > 50) sh.deleteRows(Math.max(data.length, 2) + 1, extra - 50);
}

function json_(obj) {
